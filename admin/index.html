<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel Admin — Cafetería Escolar</title>
  <link rel="icon" href="/imgs/fav-icon.png" type="image/png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css"/>
  <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --c1:#0d0d0d;--c2:#111;--c3:#191919;--c4:#222;
      --accent:#ff3c00;--accent2:#ff6b35;--gold:#ffd166;
      --paper:#faf9f7;--cream:#f2ede4;--surface:#ffffff;
      --muted:#888;--border:rgba(0,0,0,0.08);--border-dark:rgba(255,255,255,0.07);
      --success:#06d6a0;--warning:#ffd166;--error:#ff3b5c;--info:#4cc9f0;
      --font-display:'Unbounded',sans-serif;--font-body:'Outfit',sans-serif;
      --radius:16px;--radius-lg:22px;
      --shadow:0 4px 24px rgba(0,0,0,0.07);--shadow-lg:0 12px 48px rgba(0,0,0,0.12);
      --spring:all 0.4s cubic-bezier(0.34,1.56,0.64,1);--transition:all 0.2s ease;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{-webkit-font-smoothing:antialiased}
    body{font-family:var(--font-body);background:var(--paper);color:var(--c1);overflow-x:hidden}

    .admin-shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100dvh - 64px)}
    .sidebar{background:var(--c1);position:sticky;top:64px;height:calc(100dvh - 64px);overflow-y:auto;display:flex;flex-direction:column;padding:20px 0}
    .sidebar::-webkit-scrollbar{width:0}
    .sidebar-top{padding:0 20px 20px;border-bottom:1px solid var(--border-dark);margin-bottom:12px}
    .sidebar-role{font-size:0.58rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.25);margin-bottom:4px}
    .sidebar-name{font-family:var(--font-display);font-size:0.85rem;font-weight:700;color:var(--paper)}
    .sidebar-section{font-size:0.55rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.2);padding:10px 20px 4px}
    .nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 20px;border:none;background:transparent;color:rgba(255,255,255,0.45);font-family:var(--font-body);font-size:0.875rem;font-weight:500;cursor:pointer;text-align:left;transition:all 0.15s ease;position:relative}
    .nav-item:hover{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.8)}
    .nav-item.active{background:rgba(255,60,0,0.15);color:var(--paper)}
    .nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:22px;background:var(--accent);border-radius:0 3px 3px 0}
    .nav-icon{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0;transition:background 0.15s}
    .nav-item.active .nav-icon{background:rgba(255,60,0,0.28)}
    .nav-divider{height:1px;background:rgba(255,255,255,0.06);margin:8px 20px}
    .main-content{background:var(--paper);min-height:calc(100dvh - 64px);overflow-y:auto}
    .panel{padding:28px 32px;max-width:1400px;animation:panelIn 0.35s ease}
    @keyframes panelIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .panel-title{font-family:var(--font-display);font-size:1.4rem;font-weight:900;letter-spacing:-0.04em;margin-bottom:4px}
    .panel-sub{font-size:0.85rem;color:var(--muted);margin-bottom:28px}
    .quick-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
    .quick-btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:12px;border:none;font-family:var(--font-display);font-size:0.68rem;font-weight:700;letter-spacing:0.03em;cursor:pointer;transition:var(--spring)}
    .quick-btn:hover{transform:translateY(-2px)}
    .quick-btn:active{transform:scale(0.97)}
    .qb-accent{background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(255,60,0,0.3)}
    .qb-accent:hover{box-shadow:0 8px 28px rgba(255,60,0,0.45)}
    .qb-dark{background:var(--c1);color:var(--paper)}
    .qb-dark:hover{background:var(--c3)}
    .qb-outline{background:transparent;border:1.5px solid var(--border);color:var(--c1)}
    .qb-outline:hover{border-color:var(--c1);background:var(--c1);color:var(--paper)}
    .qb-success{background:var(--success);color:#fff}
    .qb-warning{background:var(--warning);color:var(--c1)}
    .qb-danger{background:var(--error);color:#fff}
    .section-label{font-family:var(--font-display);font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:10px}
    .section-label::after{content:'';flex:1;height:1px;background:var(--border)}
    .stats-grid{display:grid;gap:14px;margin-bottom:20px}
    .stats-4{grid-template-columns:repeat(4,1fr)}
    .stats-3{grid-template-columns:repeat(3,1fr)}
    .stats-6{grid-template-columns:repeat(6,1fr)}
    .stats-2{grid-template-columns:repeat(2,1fr)}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;position:relative;overflow:hidden;transition:var(--transition)}
    .stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
    .stat-card::after{content:'';position:absolute;right:-16px;top:-16px;width:80px;height:80px;border-radius:50%;opacity:0.08}
    .sc-accent::after{background:var(--accent)}.sc-success::after{background:var(--success)}.sc-info::after{background:var(--info)}.sc-warning::after{background:var(--warning)}.sc-error::after{background:var(--error)}
    .stat-label{font-family:var(--font-display);font-size:0.58rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .stat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .stat-val{font-family:var(--font-display);font-size:1.65rem;font-weight:900;letter-spacing:-0.05em;line-height:1}
    .stat-sub{font-size:0.72rem;color:var(--muted);margin-top:6px}
    .sv-accent{color:var(--accent)}.sv-success{color:var(--success)}.sv-info{color:var(--info)}.sv-warning{color:var(--warning)}.sv-error{color:var(--error)}
    .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
    .charts-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:24px}
    .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px}
    .chart-title{font-family:var(--font-display);font-size:0.75rem;font-weight:700;letter-spacing:-0.01em;margin-bottom:18px}
    .bar-chart{display:flex;align-items:flex-end;gap:7px;height:110px}
    .bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
    .bar{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--accent) 0%,var(--accent2) 100%);min-height:4px;cursor:pointer;transition:opacity 0.2s ease,height 0.6s cubic-bezier(0.34,1.56,0.64,1)}
    .bar.bar-info{background:linear-gradient(180deg,var(--info) 0%,#2fb8e8 100%)}
    .bar.bar-success{background:linear-gradient(180deg,var(--success) 0%,#04b882 100%)}
    .bar.bar-gold{background:linear-gradient(180deg,var(--gold) 0%,#e6b800 100%)}
    .bar:hover{opacity:0.8}
    .bar-label{font-size:0.58rem;color:var(--muted);text-align:center;white-space:nowrap;font-family:var(--font-display);font-weight:600}
    .top-product-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
    .tp-rank{font-family:var(--font-display);font-size:0.65rem;font-weight:900;color:var(--muted);width:16px;flex-shrink:0}
    .tp-info{flex:1;min-width:0}
    .tp-name{font-size:0.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
    .tp-bar-wrap{height:5px;background:var(--cream);border-radius:3px;overflow:hidden}
    .tp-bar{height:100%;background:var(--accent);border-radius:3px;transition:width 0.8s cubic-bezier(0.34,1.56,0.64,1)}
    .tp-count{font-family:var(--font-display);font-size:0.72rem;font-weight:700;color:var(--muted);white-space:nowrap}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
    .s-input{padding:10px 16px;border:2px solid var(--border);border-radius:14px;font-family:var(--font-body);font-size:0.875rem;min-width:200px;outline:none;transition:all 0.2s ease;background:var(--surface)}
    .s-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,60,0,0.08)}
    .table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface)}
    table{width:100%;border-collapse:collapse}
    thead th{background:var(--cream);font-family:var(--font-display);font-size:0.6rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);padding:12px 16px;text-align:left;white-space:nowrap}
    tbody td{padding:12px 16px;border-top:1px solid var(--border);font-size:0.875rem;vertical-align:middle}
    tbody tr{transition:background 0.15s ease}
    tbody tr:hover td{background:rgba(255,60,0,0.02)}
    .prod-thumb{width:40px;height:40px;border-radius:12px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:1.3rem;overflow:hidden;flex-shrink:0}
    .prod-thumb img{width:100%;height:100%;object-fit:cover}
    .status-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:100px;font-family:var(--font-display);font-size:0.6rem;font-weight:700;letter-spacing:0.04em}
    .sp-paid{background:rgba(6,214,160,0.12);color:#04a87d}
    .sp-pending{background:rgba(255,209,102,0.15);color:#b08800}
    .sp-cancelled{background:rgba(255,59,92,0.12);color:var(--error)}
    .sp-active{background:rgba(6,214,160,0.12);color:#04a87d}
    .sp-inactive{background:rgba(255,59,92,0.12);color:var(--error)}
    .sp-blocked{background:rgba(255,59,92,0.12);color:var(--error)}
    .act-btn{display:inline-flex;align-items:center;justify-content:center;padding:7px 14px;border-radius:10px;border:none;font-family:var(--font-display);font-size:0.65rem;font-weight:700;letter-spacing:0.03em;cursor:pointer;transition:var(--spring)}
    .act-btn:hover{transform:scale(1.05)}
    .act-btn:active{transform:scale(0.97)}
    .ab-ghost{background:var(--cream);color:var(--c1)}
    .ab-ghost:hover{background:var(--c1);color:var(--paper)}
    .ab-success{background:rgba(6,214,160,0.12);color:#04a87d}
    .ab-success:hover{background:var(--success);color:#fff}
    .ab-danger{background:rgba(255,59,92,0.1);color:var(--error)}
    .ab-danger:hover{background:var(--error);color:#fff}
    .ab-warning{background:rgba(255,209,102,0.15);color:#b08800}
    .ab-warning:hover{background:var(--warning);color:var(--c1)}
    .ab-accent{background:var(--accent);color:#fff}
    .ab-primary{background:var(--c1);color:var(--paper)}
    .scanner-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
    .scanner-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px}
    .scanner-box-title{font-family:var(--font-display);font-size:0.75rem;font-weight:700;letter-spacing:0.04em;margin-bottom:14px}
    .scan-tabs{display:flex;background:var(--cream);border-radius:12px;padding:4px;margin-bottom:18px;gap:2px}
    .scan-tab{flex:1;padding:9px 6px;border:none;border-radius:8px;background:transparent;font-family:var(--font-display);font-size:0.6rem;font-weight:700;letter-spacing:0.03em;cursor:pointer;color:var(--muted);transition:all 0.2s ease}
    .scan-tab.active{background:var(--c1);color:var(--paper)}
    .cam-wrap{border-radius:var(--radius);overflow:hidden;background:#0a0a0a;min-height:240px;display:flex;align-items:center;justify-content:center;position:relative}
    #qr-reader{width:100% !important;border:none !important}
    #qr-reader video{width:100% !important;object-fit:cover !important}
    #qr-reader img{display:none !important}
    #qr-reader__scan_region{border:none !important}
    #qr-reader__dashboard{background:transparent !important;border:none !important;padding:8px 0 0 !important}
    #qr-reader__dashboard_section_csr button{background:var(--accent) !important;color:white !important;border:none !important;border-radius:10px !important;padding:8px 16px !important;cursor:pointer !important}
    #qr-reader__dashboard_section_fsr{display:none !important}
    #qr-reader__status_span{font-size:.75rem !important;color:var(--muted) !important}
    .cam-placeholder{text-align:center;color:rgba(255,255,255,0.3);padding:40px 24px}
    .cam-placeholder-icon{font-size:3rem;margin-bottom:12px}
    .cam-placeholder-text{font-size:0.8rem;line-height:1.6}
    .cam-controls{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
    .manual-row{display:flex;gap:8px;margin-top:14px}
    .manual-input{flex:1;padding:12px 16px;border:2px solid var(--border);border-radius:12px;font-family:var(--font-body);font-size:0.875rem;outline:none;transition:all 0.2s}
    .manual-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,60,0,0.08)}
    .result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;min-height:220px;display:flex;align-items:center;justify-content:center}
    .result-card.has-result{align-items:flex-start;animation:panelIn 0.3s ease}
    .result-empty{text-align:center;color:var(--muted)}
    .result-empty-icon{font-size:2.5rem;margin-bottom:10px}
    .result-empty-title{font-family:var(--font-display);font-size:0.9rem;font-weight:700;margin-bottom:6px}
    .result-empty-sub{font-size:0.8rem}
    .result-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px;width:100%}
    .result-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-bottom:16px}
    .rmeta-label{font-family:var(--font-display);font-size:0.58rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
    .rmeta-val{font-size:0.875rem;font-weight:600}
    .result-actions{display:flex;gap:8px;flex-wrap:wrap;width:100%;margin-top:16px}
    .low-stock-alert{background:#fffbf0;border:1px solid rgba(255,209,102,0.4);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:20px}
    .low-stock-title{font-family:var(--font-display);font-size:0.72rem;font-weight:700;color:#8a5a00;margin-bottom:8px}
    .stock-chips{display:flex;flex-wrap:wrap;gap:6px}
    .stock-chip{padding:4px 10px;border-radius:100px;background:rgba(255,209,102,0.2);color:#8a5a00;font-size:0.72rem;font-weight:600}
    .pending-rev-card{background:var(--c1);color:var(--paper);border-radius:var(--radius-lg);padding:22px 24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
    .pr-amount{font-family:var(--font-display);font-size:1.6rem;font-weight:900;color:var(--warning);letter-spacing:-0.04em}
    .pr-label{font-size:0.68rem;font-weight:700;font-family:var(--font-display);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:4px}
    .pr-sub{font-size:0.8rem;color:rgba(255,255,255,0.45);flex:1;min-width:160px;line-height:1.6}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-grid .full{grid-column:1/-1}
    .field-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .field-label{font-family:var(--font-display);font-size:0.6rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)}
    .field-input{padding:12px 16px;border:2px solid var(--border);border-radius:12px;font-family:var(--font-body);font-size:0.875rem;outline:none;transition:all 0.2s}
    .field-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,60,0,0.08)}
    .cam-perm-tip{background:#fff8f0;border:1px solid #f0c070;border-radius:12px;padding:12px 14px;font-size:0.78rem;color:#6a4400;margin-top:10px;display:none}
    .queue-panel{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
    .queue-card{background:var(--c1);color:var(--paper);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:16px}
    .queue-card-title{font-family:var(--font-display);font-size:0.65rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.3)}
    .queue-turn-num{font-family:var(--font-display);font-size:5rem;font-weight:900;line-height:1;letter-spacing:-0.06em;color:var(--warning);text-align:center;padding:12px 0}
    .queue-turn-num.inactive{color:rgba(255,255,255,0.15);font-size:3rem}
    .queue-controls{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
    .qc-btn{width:52px;height:52px;border-radius:16px;border:none;font-size:1.4rem;font-weight:900;cursor:pointer;transition:var(--spring);display:flex;align-items:center;justify-content:center;font-family:var(--font-display)}
    .qc-btn:hover{transform:scale(1.08)}
    .qc-btn:active{transform:scale(0.96)}
    .qc-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none}
    .qc-prev{background:rgba(255,255,255,0.1);color:var(--paper)}
    .qc-prev:hover{background:rgba(255,255,255,0.18)}
    .qc-next{background:var(--accent);color:#fff;box-shadow:0 4px 20px rgba(255,60,0,0.45)}
    .qc-next:hover{box-shadow:0 8px 32px rgba(255,60,0,0.6)}
    .toggle-btn{width:100%;padding:14px;border:none;border-radius:14px;font-family:var(--font-display);font-size:0.78rem;font-weight:700;letter-spacing:0.04em;cursor:pointer;transition:var(--spring)}
    .toggle-btn:hover{transform:translateY(-2px)}
    .toggle-btn.on{background:var(--error);color:#fff;box-shadow:0 4px 16px rgba(255,59,92,0.35)}
    .toggle-btn.off{background:var(--success);color:#fff;box-shadow:0 4px 16px rgba(6,214,160,0.35)}
    .queue-status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
    .queue-status-dot.on{background:var(--success);animation:pulse-dot 1.5s ease-in-out infinite}
    .queue-status-dot.off{background:rgba(255,255,255,0.2)}
    @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.4}}
    .queue-order-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:16px}
    .queue-order-name{font-size:0.9rem;font-weight:700;margin-bottom:4px}
    .queue-order-meta{font-size:0.75rem;color:rgba(255,255,255,0.45)}
    .queue-order-total{font-family:var(--font-display);font-size:1.1rem;font-weight:900;color:var(--warning);margin-top:8px}
    .queue-input-row{display:flex;gap:8px}
    .queue-num-input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.07);color:var(--paper);font-family:var(--font-display);font-size:0.9rem;font-weight:700;outline:none;text-align:center}
    .queue-num-input:focus{border-color:var(--accent)}
    .live-dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;margin-right:6px;animation:pulse-dot 1.5s ease-in-out infinite}
    .sse-status{display:flex;align-items:center;gap:6px;font-size:0.72rem;color:var(--muted);padding:6px 12px;border-radius:100px;background:var(--cream)}
    .sse-status.connected .sse-dot{background:var(--success)}
    .sse-status.disconnected .sse-dot{background:var(--error)}
    .sse-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
    .mobile-bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--c1);border-top:1px solid var(--border-dark);z-index:100;padding:8px 0 env(safe-area-inset-bottom,0)}
    .mbn-inner{display:flex;justify-content:space-around}
    .mbn-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 16px;border:none;background:transparent;color:rgba(255,255,255,0.35);font-family:var(--font-display);font-size:0.55rem;font-weight:700;letter-spacing:0.04em;cursor:pointer;transition:all 0.2s}
    .mbn-btn.active{color:var(--accent)}
    .mbn-icon{font-size:1.3rem}
    .dash-section{margin-bottom:32px}
    .donut-wrap{display:flex;flex-direction:column;gap:8px}
    .donut-row{display:flex;align-items:center;gap:10px}
    .donut-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .donut-label{font-size:0.8rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .donut-val{font-family:var(--font-display);font-size:0.75rem;font-weight:700;color:var(--muted)}
    .donut-bar-bg{flex:1;height:6px;background:var(--cream);border-radius:3px;overflow:hidden}

    .hour-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
    .hour-bar{width:100%;border-radius:3px 3px 0 0;background:var(--info);min-height:2px;transition:height 0.6s cubic-bezier(0.34,1.56,0.64,1);opacity:0.7}
    .hour-bar.peak{background:var(--accent);opacity:1}
    .hour-label{font-size:0.42rem;color:var(--muted);font-family:var(--font-display);font-weight:600}
    .insight-card{background:var(--c1);border-radius:var(--radius-lg);padding:20px 22px;color:var(--paper);display:flex;gap:16px;align-items:flex-start}
    .insight-icon{font-size:1.5rem;flex-shrink:0}
    .insight-label{font-family:var(--font-display);font-size:0.55rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:4px}
    .insight-val{font-family:var(--font-display);font-size:1.1rem;font-weight:900;color:var(--warning);letter-spacing:-0.03em;line-height:1.1}
    .insight-sub{font-size:0.72rem;color:rgba(255,255,255,0.35);margin-top:4px}
    .export-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
    .export-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--c1);font-family:var(--font-display);font-size:0.65rem;font-weight:700;cursor:pointer;transition:all 0.2s}
    .export-btn:hover{background:var(--c1);color:var(--paper);border-color:var(--c1);transform:translateY(-2px)}
    .jornada-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .jornada-card{border-radius:var(--radius);padding:18px;border:1px solid var(--border);background:var(--surface)}
    .jornada-label{font-family:var(--font-display);font-size:0.58rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    .jornada-val{font-family:var(--font-display);font-size:1.4rem;font-weight:900;letter-spacing:-0.04em}

    @media(max-width:1100px){.stats-4{grid-template-columns:repeat(2,1fr)}.stats-6{grid-template-columns:repeat(3,1fr)}.charts-row{grid-template-columns:1fr}.charts-row-3{grid-template-columns:1fr}.queue-panel{grid-template-columns:1fr}}
    @media(max-width:900px){.admin-shell{grid-template-columns:1fr}.sidebar{display:none}.mobile-bottom-nav{display:block}.main-content{padding-bottom:72px}.panel{padding:16px}.scanner-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.stats-4{grid-template-columns:repeat(2,1fr);gap:10px}.stats-6{grid-template-columns:repeat(2,1fr);gap:10px}.toolbar{flex-direction:column;align-items:stretch}.s-input{min-width:unset}.result-meta{grid-template-columns:1fr}.stats-2{grid-template-columns:1fr}.jornada-grid{grid-template-columns:1fr}}
    @media(max-width:480px){.stats-6{grid-template-columns:repeat(2,1fr)}.stat-val{font-size:1.3rem}}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<nav class="nav" id="main-nav"></nav>

<div class="admin-shell">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-role">Panel de control</div>
      <div class="sidebar-name" id="sidebar-admin-name">Administrador</div>
    </div>
    <div class="sidebar-section">Principal</div>
    <button class="nav-item active" data-panel="dashboard" onclick="showPanel('dashboard',this)"><div class="nav-icon">📊</div> Dashboard</button>
    <div class="nav-divider"></div>
    <div class="sidebar-section">Turnos</div>
    <button class="nav-item" data-panel="queue" onclick="showPanel('queue',this)"><div class="nav-icon">🎫</div> Turnos</button>
    <div class="nav-divider"></div>
    <div class="sidebar-section">Escanear</div>
    <button class="nav-item" data-panel="scanner" onclick="showPanel('scanner',this)"><div class="nav-icon">📷</div> Escanear QR</button>
    <div class="nav-divider"></div>
    <div class="sidebar-section">Gestión</div>
    <button class="nav-item" data-panel="products" onclick="showPanel('products',this)"><div class="nav-icon">📦</div> Productos</button>
    <button class="nav-item" data-panel="users" onclick="showPanel('users',this)"><div class="nav-icon">👥</div> Usuarios</button>
    <button class="nav-item" data-panel="orders" onclick="showPanel('orders',this)"><div class="nav-icon">📋</div> Pedidos</button>
  </aside>

  <main class="main-content" id="admin-main">
    <div style="display:flex;justify-content:center;padding:64px">
      <div style="width:36px;height:36px;border:3px solid rgba(0,0,0,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite"></div>
    </div>
  </main>
</div>

<div class="mobile-bottom-nav">
  <div class="mbn-inner">
    <button class="mbn-btn active" onclick="showPanel('dashboard',null,'dashboard')"><span class="mbn-icon">📊</span>Dashboard</button>
    <button class="mbn-btn" onclick="showPanel('queue',null,'queue')"><span class="mbn-icon">🎫</span>Turnos</button>
    <button class="mbn-btn" onclick="showPanel('scanner',null,'scanner')"><span class="mbn-icon">📷</span>Escáner</button>
    <button class="mbn-btn" onclick="showPanel('products',null,'products')"><span class="mbn-icon">📦</span>Productos</button>
    <button class="mbn-btn" onclick="showPanel('orders',null,'orders')"><span class="mbn-icon">📋</span>Pedidos</button>
  </div>
</div>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/sse.js"></script>
<script>
auth.requireAdmin();
buildNav('admin');

const user = auth.getUser();
if (user) document.getElementById('sidebar-admin-name').textContent = user.full_name?.split(' ')[0] || 'Admin';

let html5QrCode = null, isScanning = false, currentScanType = 'order';
let lastScanned = '', lastScannedTime = 0;
let currentQueueState = { enabled: false, current_turn: 0, current_order: null };
const panels = ['dashboard','queue','scanner','products','users','orders'];
const CAT_COLORS = ['#ff3c00','#4cc9f0','#06d6a0','#ffd166','#f72585','#7209b7','#3a86ff','#fb5607'];

SSE.on('stats_updated', () => {});
SSE.on('orders_updated', data => { if (document.getElementById('orders-tbody')) refreshOrdersTable(data.orders); });
SSE.on('admin_products_updated', data => { updateLowStockBadge(data.products); });
SSE.on('queue', state => { currentQueueState = state; updateQueueUI(state); });
SSE.on('connected', () => {
  const dot = document.getElementById('sse-dot'), label = document.getElementById('sse-label');
  if (dot) { dot.parentElement.className = 'sse-status connected'; label.textContent = 'En vivo'; }
});

function updateLowStockBadge(products) {
  const low = products.filter(p => p.active && parseInt(p.stock) <= 3);
  const el = document.getElementById('low-stock-count');
  if (el) el.textContent = low.length > 0 ? `⚠️ ${low.length} bajo stock` : '';
}

function updateQueueUI(state) {
  const numEl = document.getElementById('queue-turn-num'), toggleBtn = document.getElementById('queue-toggle-btn');
  const prevBtn = document.getElementById('queue-prev-btn'), nextBtn = document.getElementById('queue-next-btn');
  const orderEl = document.getElementById('queue-current-order'), statusLabel = document.getElementById('queue-status-label');
  const statusDot = document.getElementById('queue-status-dot');
  if (numEl) { numEl.className = state.enabled ? 'queue-turn-num' : 'queue-turn-num inactive'; numEl.textContent = state.enabled ? (state.current_turn > 0 ? String(state.current_turn).padStart(3,'0') : '---') : 'OFF'; }
  if (toggleBtn) { toggleBtn.className = state.enabled ? 'toggle-btn on' : 'toggle-btn off'; toggleBtn.textContent = state.enabled ? '⏹ Desactivar turnos' : '▶ Activar turnos'; }
  if (prevBtn) prevBtn.disabled = !state.enabled || state.current_turn <= 1;
  if (nextBtn) nextBtn.disabled = !state.enabled;
  if (statusLabel) statusLabel.textContent = state.enabled ? 'Sistema activo' : 'Sistema inactivo';
  if (statusDot) statusDot.className = 'queue-status-dot ' + (state.enabled ? 'on' : 'off');
  if (orderEl) {
    if (state.enabled && state.current_order) {
      const o = state.current_order;
      orderEl.innerHTML = `<div class="queue-order-card"><div class="queue-order-name">${escapeStr(o.full_name)}</div><div class="queue-order-meta">${o.grade} · Pedido #${o.id}</div><div class="queue-order-total">${fmtCurrency(o.total)}</div><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${o.status!=='paid'?`<button class="act-btn ab-success" style="font-size:0.6rem" onclick="setOrderStatus(${o.id},'paid')">✅ Marcar pagado</button>`:''}${o.status==='pending'?`<button class="act-btn ab-danger" style="font-size:0.6rem" onclick="setOrderStatus(${o.id},'cancelled')">❌ Cancelar</button>`:''}</div></div>`;
    } else {
      orderEl.innerHTML = `<div style="font-size:0.8rem;color:rgba(255,255,255,0.3);text-align:center;padding:16px">${state.enabled ? 'Ningún turno activo aún.<br/>Presiona ➜ para avanzar.' : 'Activa el sistema de turnos para comenzar.'}</div>`;
    }
  }
}

function refreshOrdersTable(orders) {
  const tbody = document.getElementById('orders-tbody');
  if (!tbody) return;
  tbody.innerHTML = orders.map(o => `<tr data-status="${o.status}">
    <td style="font-family:var(--font-display);font-weight:900">#${o.id}</td>
    <td><div style="font-weight:600">${o.full_name}</div></td>
    <td><span style="font-size:0.72rem;font-weight:700;background:var(--cream);padding:4px 10px;border-radius:100px">${o.grade}</span></td>
    <td style="font-family:var(--font-display);font-weight:800;color:var(--accent)">${fmtCurrency(o.total)}</td>
    <td>${o.turn_number?`<span style="font-family:var(--font-display);font-weight:900;font-size:1rem;color:var(--warning)">#${String(o.turn_number).padStart(3,'0')}</span>`:'<span style="color:var(--muted);font-size:0.75rem">—</span>'}</td>
    <td>${statusPill(o.status)}</td>
    <td style="font-size:0.75rem;color:var(--muted)">${fmtDate(o.created_at)}</td>
    <td><div style="display:flex;gap:6px;flex-wrap:wrap">
      ${o.status!=='paid'?`<button class="act-btn ab-success" onclick="setOrderStatus(${o.id},'paid')">✅</button>`:''}
      ${o.status==='pending'?`<button class="act-btn ab-danger" onclick="setOrderStatus(${o.id},'cancelled')">❌</button>`:''}
      ${o.status!=='pending'?`<button class="act-btn ab-warning" onclick="setOrderStatus(${o.id},'pending')">⏳</button>`:''}
    </div></td>
  </tr>`).join('');
}

function showPanel(name, btn, mobilePanel) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else document.querySelector(`.nav-item[data-panel="${name}"]`)?.classList.add('active');
  const pName = mobilePanel || name;
  document.querySelectorAll('.mbn-btn').forEach((b,i) => b.classList.toggle('active', panels[i]===pName));
  stopCamera();
  const el = document.getElementById('admin-main');
  el.innerHTML = `<div style="display:flex;justify-content:center;padding:64px"><div style="width:36px;height:36px;border:3px solid rgba(0,0,0,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite"></div></div>`;
  if (name==='dashboard') renderDashboard(el);
  else if (name==='queue') renderQueue(el);
  else if (name==='products') renderProducts(el);
  else if (name==='users') renderUsers(el);
  else if (name==='orders') renderOrders(el);
  else if (name==='scanner') renderScanner(el);
}

const setPanel = (el, html) => { el.innerHTML = `<div class="panel">${html}</div>`; };

function exportCSV(data, filename) {
  const cols = Object.keys(data[0] || {});
  const csv = [cols.join(','), ...data.map(row => cols.map(c => `"${String(row[c] ?? '').replace(/"/g,'""')}"`).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent('\uFEFF' + csv);
  a.download = filename;
  a.click();
}

function buildOrdersCSV(orders) {
  return orders.map(o => ({
    'ID': o.id, 'Estudiante': o.full_name, 'Grado': o.grade,
    'Total': o.total, 'Estado': o.status, 'Turno': o.turn_number || '',
    'Fecha': o.created_at, 'Pagado': o.paid_at || ''
  }));
}

async function exportToday() {
  try {
    const orders = await api.get('/orders');
    const today = new Date().toISOString().slice(0,10);
    const todayOrders = orders.filter(o => o.created_at?.startsWith(today));
    if (!todayOrders.length) { toast('No hay pedidos hoy','warning'); return; }
    exportCSV(buildOrdersCSV(todayOrders), `pedidos_hoy_${today}.csv`);
    toast('✅ CSV de hoy exportado','success');
  } catch(e) { toast(e.message,'error'); }
}

async function exportMonth() {
  try {
    const orders = await api.get('/orders');
    const month = new Date().toISOString().slice(0,7);
    const monthOrders = orders.filter(o => o.created_at?.startsWith(month));
    if (!monthOrders.length) { toast('No hay pedidos este mes','warning'); return; }
    exportCSV(buildOrdersCSV(monthOrders), `pedidos_mes_${month}.csv`);
    toast('✅ CSV del mes exportado','success');
  } catch(e) { toast(e.message,'error'); }
}

async function generatePDF(stats, orders) {
  const now = new Date().toLocaleDateString('es-CO', {timeZone:'America/Bogota',year:'numeric',month:'long',day:'numeric'});
  const month = new Date().toLocaleDateString('es-CO', {timeZone:'America/Bogota',year:'numeric',month:'long'});
  const paid = orders.filter(o => o.status==='paid');
  const monthStr = new Date().toISOString().slice(0,7);
  const monthPaid = paid.filter(o => o.created_at?.startsWith(monthStr));
  const monthRevenue = monthPaid.reduce((s,o) => s+parseFloat(o.total||0), 0);
  const todayStr = new Date().toISOString().slice(0,10);
  const todayPaid = paid.filter(o => o.created_at?.startsWith(todayStr));
  const todayRevenue = todayPaid.reduce((s,o) => s+parseFloat(o.total||0), 0);

  const html = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Reporte Contabilidad</title>
  <style>body{font-family:Arial,sans-serif;margin:40px;color:#111;font-size:13px}
  h1{font-size:22px;color:#ff3c00;margin-bottom:4px}h2{font-size:14px;color:#555;margin-bottom:24px;font-weight:normal}
  .header{border-bottom:3px solid #ff3c00;padding-bottom:16px;margin-bottom:28px}
  .meta{font-size:11px;color:#888;margin-top:6px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:28px}
  .card{border:1px solid #e0e0e0;border-radius:8px;padding:16px}
  .card-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#888;margin-bottom:6px}
  .card-val{font-size:20px;font-weight:900;color:#ff3c00}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:11px}
  th{background:#f5f5f5;padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:#666}
  td{padding:7px 10px;border-bottom:1px solid #f0f0f0}
  .footer{margin-top:40px;font-size:10px;color:#aaa;text-align:center;border-top:1px solid #eee;padding-top:16px}
  </style></head><body>
  <div class="header">
    <h1>🍽️ Cafetería Santa Juana de Lestonnac</h1>
    <h2>Reporte de Contabilidad — ${month}</h2>
    <div class="meta">Generado: ${now} | Administrador: ${user?.full_name || 'Admin'}</div>
  </div>
  <div class="grid">
    <div class="card"><div class="card-label">Ingresos Hoy</div><div class="card-val">${fmtCurrency(todayRevenue)}</div></div>
    <div class="card"><div class="card-label">Ingresos del Mes</div><div class="card-val">${fmtCurrency(monthRevenue)}</div></div>
    <div class="card"><div class="card-label">Ingresos Totales</div><div class="card-val">${fmtCurrency(paid.reduce((s,o)=>s+parseFloat(o.total||0),0))}</div></div>
    <div class="card"><div class="card-label">Pedidos Pagados</div><div class="card-val">${paid.length}</div></div>
    <div class="card"><div class="card-label">Pedidos Pendientes</div><div class="card-val">${orders.filter(o=>o.status==='pending').length}</div></div>
    <div class="card"><div class="card-label">Ticket Promedio</div><div class="card-val">${fmtCurrency(stats.avg_ticket||0)}</div></div>
  </div>
  <h3 style="margin-bottom:12px;font-size:13px">Pedidos del Mes (${monthPaid.length} pagados)</h3>
  <table><thead><tr><th>#</th><th>Estudiante</th><th>Grado</th><th>Total</th><th>Fecha</th></tr></thead><tbody>
  ${monthPaid.slice(0,100).map(o=>`<tr><td>#${o.id}</td><td>${o.full_name||''}</td><td>${o.grade||''}</td><td>${fmtCurrency(o.total)}</td><td>${fmtDate(o.created_at)}</td></tr>`).join('')}
  </tbody></table>
  <div class="footer">Cafetería Escolar Santa Juana de Lestonnac · Sistema Digital de Pedidos · ${now}</div>
  </body></html>`;

  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
  setTimeout(() => win.print(), 500);
}

async function renderDashboard(el) {
  let stats = null, orders = [], products = [];
  try {
    [stats, orders, products] = await Promise.all([
      api.get('/stats/full'),
      api.get('/orders'),
      api.get('/products?all=1')
    ]);
  } catch(e) {
    setPanel(el, `<div class="panel-title">Dashboard</div><div style="color:var(--error);margin-top:20px">Error: ${escapeStr(e.message)}</div>`);
    return;
  }

  const s = stats.summary;
  const now = new Date();
  const colombiaDate = new Date(now.toLocaleString('en-US',{timeZone:'America/Bogota'}));
  const lowStock = products.filter(p => p.active && parseInt(p.stock)<=3);
  const maxRev = Math.max(...(stats.six_months||[]).map(m=>m.revenue),1);
  const maxHour = Math.max(...(stats.hourly_usage||[]),1);
  const catColors = CAT_COLORS;
  const catEntries = Object.entries(stats.category_sales||{});
  const totalCatRev = catEntries.reduce((s,[,v])=>s+v,0);
  const avgWaitMin = s.avg_wait_seconds > 0 ? (s.avg_wait_seconds/60).toFixed(1) : '—';

  const barHTML = (stats.six_months||[]).map(m =>
    `<div class="bar-wrap"><div class="bar" style="height:${Math.max(8,(m.revenue/maxRev)*100)}px" title="${fmtCurrency(m.revenue)}"></div><div class="bar-label">${m.label}</div></div>`
  ).join('');

  const hourlyHTML = (stats.hourly_usage||[]).map((v,h) => {
    const isPeak = v === maxHour && v > 0;
    const pct = maxHour > 0 ? Math.max(4, (v/maxHour)*56) : 4;
    const lbl = h === 0 ? '12a' : h < 12 ? h+'a' : h === 12 ? '12p' : (h-12)+'p';
    return `<div class="hour-bar-wrap"><div class="hour-bar${isPeak?' peak':''}" style="height:${pct}px" title="${h}:00 — ${v} pedidos"></div><div class="hour-label">${[6,9,12,15,18].includes(h)?lbl:''}</div></div>`;
  }).join('');

  const topProductsHTML = Object.entries(stats.top_products||{}).slice(0,5).map(([name,data],i) => {
    const maxQty = Object.values(stats.top_products||{})[0]?.qty || 1;
    return `<div class="top-product-row"><span class="tp-rank">${i+1}</span><div class="tp-info"><div class="tp-name">${escapeStr(name)}</div><div class="tp-bar-wrap"><div class="tp-bar" style="width:${(data.qty/maxQty*100)}%"></div></div></div><span class="tp-count">${data.qty} uds</span></div>`;
  }).join('');

  const bottomProductsHTML = Object.entries(stats.bottom_products||{}).slice(0,5).map(([name,data],i) =>
    `<div class="top-product-row"><span class="tp-rank" style="color:var(--error)">${i+1}</span><div class="tp-info"><div class="tp-name">${escapeStr(name)}</div></div><span class="tp-count">${data.qty} uds</span></div>`
  ).join('');

  const catHTML = catEntries.map(([cat,rev],i) =>
    `<div class="donut-row"><div class="donut-dot" style="background:${catColors[i%catColors.length]}"></div><span class="donut-label">${cat}</span><div class="donut-bar-bg"><div class="donut-bar-fill" style="width:${totalCatRev>0?(rev/totalCatRev*100):0}%;background:${catColors[i%catColors.length]}"></div></div><span class="donut-val">${fmtCurrency(rev)}</span></div>`
  ).join('') || '<div style="font-size:0.8rem;color:var(--muted)">Sin datos de ventas aún</div>';

  const gradeHTML = (stats.grade_distribution||[]).slice(0,8).map((g,i) =>
    `<div class="donut-row"><div class="donut-dot" style="background:${catColors[i%catColors.length]}"></div><span class="donut-label">${g.grade}</span><div class="donut-bar-bg"><div class="donut-bar-fill" style="width:${g.pct}%;background:${catColors[i%catColors.length]}"></div></div><span class="donut-val">${g.pct}% (${g.count})</span></div>`

async function loadQueueOrders() {
  const el = document.getElementById('queue-orders-table');
  if (!el) return;
  try {
    const orders = await api.get('/orders');
    const today = new Date().toISOString().slice(0,10);
    const todayOrders = orders.filter(o => o.created_at?.startsWith(today) && o.turn_number);
    if (!todayOrders.length) { el.innerHTML = '<div style="padding:24px;text-align:center;font-size:0.85rem;color:var(--muted)">No hay pedidos con turno asignado hoy.</div>'; return; }
    el.innerHTML = `<table><thead><tr><th>Turno</th><th>Pedido</th><th>Estudiante</th><th>Total</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${todayOrders.sort((a,b)=>a.turn_number-b.turn_number).map(o=>`<tr>
      <td><span style="font-family:var(--font-display);font-size:1.1rem;font-weight:900;color:var(--warning)">#${String(o.turn_number).padStart(3,'0')}</span></td>
      <td style="font-family:var(--font-display);font-weight:900">#${o.id}</td>
      <td><div style="font-weight:600">${o.full_name}</div><div style="font-size:0.72rem;color:var(--muted)">${o.grade}</div></td>
      <td style="font-family:var(--font-display);font-weight:800;color:var(--accent)">${fmtCurrency(o.total)}</td>
      <td>${statusPill(o.status)}</td>
      <td><div style="display:flex;gap:6px">
        ${o.status!=='paid'?`<button class="act-btn ab-success" onclick="setOrderStatus(${o.id},'paid',false,loadQueueOrders)">✅</button>`:''}
        ${o.status==='pending'?`<button class="act-btn ab-danger" onclick="setOrderStatus(${o.id},'cancelled',false,loadQueueOrders)">❌</button>`:''}
      </div></td>
    </tr>`).join('')}</tbody></table>`;
  } catch(e) { el.innerHTML = `<div style="padding:24px;color:var(--error);font-size:0.85rem">Error: ${escapeStr(e.message)}</div>`; }
}

async function queueToggle() {
  const btn = document.getElementById('queue-toggle-btn');
  if (btn) { btn.disabled=true; btn.textContent='...'; }
  try {
    const res = await api.put('/queue/toggle', {});
    currentQueueState = {...currentQueueState,...res};
    updateQueueUI(currentQueueState);
    toast(res.enabled ? '✅ Sistema de turnos activado' : '⏹ Sistema de turnos desactivado', 'success');
    await loadQueueOrders();
  } catch(e) { toast(e.message,'error'); }
  finally { if (btn) btn.disabled=false; }
}

async function queueNext() { try { const res=await api.put('/queue/next',{}); currentQueueState.current_turn=res.current_turn; await loadQueueOrders(); } catch(e){toast(e.message,'error');} }
async function queuePrev() { try { const res=await api.put('/queue/prev',{}); currentQueueState.current_turn=res.current_turn; await loadQueueOrders(); } catch(e){toast(e.message,'error');} }

async function queueJump() {
  const input = document.getElementById('queue-jump-input'), num=parseInt(input?.value);
  if (!num||num<0) { toast('Ingresa un número válido','warning'); return; }
  try { await api.put('/queue/set/'+num,{}); if(input) input.value=''; } catch(e){toast(e.message,'error');}
}

async function queueReset() {
  confirm('¿Reiniciar el conteo de turnos a 0?', async () => {
    try { await api.post('/queue/reset',{}); toast('Turnos reiniciados','success'); await loadQueueOrders(); } catch(e){toast(e.message,'error');}
  });
}

function setScanType(type, btn) {
  currentScanType = type;
  document.querySelectorAll('.scan-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  clearScanResult();
  const ph = {order:'Token del QR o ID del pedido...',user:'Número de documento del estudiante...',product:'ID del producto...'};
  const inp = document.getElementById('manual-token');
  if (inp) inp.placeholder = ph[type]||'';
}

function clearScanResult() {
  const r = document.getElementById('scan-result');
  if (!r) return;
  r.className='result-card';
  r.innerHTML=`<div class="result-empty"><div class="result-empty-icon">🔍</div><div class="result-empty-title">Sin resultado</div><div class="result-empty-sub">Escanea un QR o ingresa un token/ID</div></div>`;
}

async function manualSearch() {
  const token=(document.getElementById('manual-token')?.value||'').trim();
  if(!token){toast('Ingresa un valor para buscar','warning');return;}
  await processScanResult(token);
}

function extractTokenFromQR(raw) {
  if (!raw) return null;
  let parsed=null;
  try{parsed=JSON.parse(raw);}catch(e){}
  if(!parsed){try{const b=raw.replace(/-/g,'+').replace(/_/g,'/');parsed=JSON.parse(atob(b+'==='.slice((b.length+3)%4)));}catch(e){}}
  if(parsed) return {token:parsed.token||null,type:parsed.type||null,id:parsed.id||null,raw:parsed};
  return {token:raw,type:null,id:null,raw:null};
}

async function processScanResult(raw) {
  const resultEl=document.getElementById('scan-result');
  if(!resultEl) return;
  resultEl.className='result-card';
  resultEl.innerHTML=`<div style="display:flex;justify-content:center;width:100%"><div style="width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite"></div></div>`;
  const extracted=extractTokenFromQR(raw);
  let type=currentScanType;
  if(extracted.type==='order') type='order';
  else if(extracted.type==='product') type='product';
  try {
    if(type==='order') await showOrderResult(extracted.token||raw, resultEl);
    else if(type==='product') await showProductResult(extracted.id||parseInt(raw), resultEl);
    else await showUserResult(raw, resultEl);
  } catch(e) {
    resultEl.className='result-card';

async function startCamera() {
  const tipEl=document.getElementById('cam-perm-tip'), placeholder=document.getElementById('qr-reader-placeholder'), readerEl=document.getElementById('qr-reader');
  if(!readerEl) return;
  if(html5QrCode){try{await html5QrCode.stop();}catch(e){} html5QrCode=null;}
  html5QrCode=new Html5Qrcode('qr-reader');
  const onScanSuccess=async(decodedText)=>{
    const now=Date.now();
    if(decodedText===lastScanned&&now-lastScannedTime<4000) return;
    lastScanned=decodedText; lastScannedTime=now;
    await stopCamera(); toast('✓ QR detectado','success'); await processScanResult(decodedText);
  };
  try {
    if(placeholder) placeholder.style.display='none';
    readerEl.style.display='block';
    await html5QrCode.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220},aspectRatio:1.333},onScanSuccess,()=>{});
    isScanning=true;
    document.getElementById('btn-start-cam').style.display='none';
    document.getElementById('btn-stop-cam').style.display='';
  } catch(err) {
    readerEl.style.display='none';
    if(placeholder) placeholder.style.display='';
    if(tipEl) tipEl.style.display='block';
    toast('No se pudo acceder a la cámara.','error');
    html5QrCode=null; isScanning=false;
  }
}

async function stopCamera() {
  if(html5QrCode&&isScanning){try{await html5QrCode.stop();}catch(e){} html5QrCode=null;}
  isScanning=false;
  const placeholder=document.getElementById('qr-reader-placeholder'), readerEl=document.getElementById('qr-reader');
  const startBtn=document.getElementById('btn-start-cam'), stopBtn=document.getElementById('btn-stop-cam');
  if(readerEl) readerEl.style.display='none';
  if(placeholder) placeholder.style.display='';
  if(startBtn) startBtn.style.display='';
  if(stopBtn) stopBtn.style.display='none';
}

function openProductModal(productJsonStr) {
  let p = null;
  if (productJsonStr) {
    try { p = typeof productJsonStr === 'string' ? JSON.parse(productJsonStr) : productJsonStr; } catch(e) { toast('Error al cargar datos del producto','error'); return; }
  }
  const isEdit = !!p;
  const m = modal(`
    <div class="form-grid">
      <div class="field-group full"><label class="field-label">Nombre del producto</label><input class="field-input" id="pf-name" value="${escapeStr(p?.name||'')}" placeholder="Ej: Gaseosa"/></div>
      <div class="field-group full"><label class="field-label">Descripción</label><textarea class="field-input" id="pf-desc" placeholder="Descripción" style="resize:vertical;min-height:80px">${escapeStr(p?.description||'')}</textarea></div>
      <div class="field-group"><label class="field-label">Precio (COP)</label><input class="field-input" id="pf-price" type="number" value="${p?.price||''}" placeholder="5000"/></div>
      <div class="field-group"><label class="field-label">Stock</label><input class="field-input" id="pf-stock" type="number" value="${p?.stock!==undefined?p.stock:''}" placeholder="10"/></div>
      <div class="field-group"><label class="field-label">Categoría</label>
        <select class="field-input" id="pf-cat">${['almuerzos','desayunos','rapidos','bebidas','snacks','postres','general'].map(c=>`<option value="${c}"${p?.category===c?' selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="field-group"><label class="field-label">URL de imagen (opcional)</label><input class="field-input" id="pf-img" value="${escapeStr(p?.image||'')}" placeholder="https://..."/></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="quick-btn qb-accent" id="btn-save-prod">💾 ${isEdit?'Actualizar':'Crear producto'}</button>
      <button class="quick-btn qb-outline" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
    </div>`, {title: isEdit?'Editar producto':'Nuevo producto'});

  m.querySelector('#btn-save-prod').onclick = async () => {
    const nameVal = m.querySelector('#pf-name').value.trim();
    const priceVal = parseFloat(m.querySelector('#pf-price').value);
    if (!nameVal || isNaN(priceVal)) { toast('Nombre y precio son requeridos','warning'); return; }
    const body = { name: nameVal, description: m.querySelector('#pf-desc').value.trim(), price: priceVal, stock: parseInt(m.querySelector('#pf-stock').value) || 0, category: m.querySelector('#pf-cat').value, image: m.querySelector('#pf-img').value.trim() || null };
    try {
      isEdit ? await api.put('/products/'+p.id, body) : await api.post('/products', body);
      toast(isEdit?'Producto actualizado':'Producto creado','success');
      m.remove(); showPanel('products');
    } catch(e) { toast(e.message,'error'); }
  };
}

    </div>
    <div style="text-align:center">
      <div style="font-size:0.7rem;color:var(--muted);margin-bottom:10px">QR del pedido</div>
      <div id="${qrId}" style="display:inline-block;background:white;padding:10px;border:1px solid var(--border);border-radius:12px"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${o.status!=='paid'?`<button class="act-btn ab-success" onclick="setOrderStatus(${o.id},'paid',true)">✅ Marcar pagado</button>`:''}
      <button class="act-btn ab-warning" onclick="setOrderStatus(${o.id},'pending',true)">⏳ Pendiente</button>
      <button class="act-btn ab-danger" onclick="setOrderStatus(${o.id},'cancelled',true)">❌ Cancelar</button>
    </div>
  </div>`,{title:`Pedido #${o.id}`});
  setTimeout(()=>{ const qrEl=document.getElementById(qrId); if(qrEl&&typeof QRCode!=='undefined') new QRCode(qrEl,{text:JSON.stringify({token:o.qr_token,orderId:o.id}),width:140,height:140}); },100);
}

async function setOrderStatus(id, status, fromModal=false, callback=null) {
  try {
    await api.put('/orders/'+id+'/status',{status});
    toast('Estado actualizado: '+status,'success');
    if(fromModal) document.querySelector('.modal-overlay')?.remove();
    if(callback) await callback(); else showPanel('orders');
  } catch(e) { toast(e.message,'error'); }
}

function showProductQRModal(id, name, price) {
  const qrId='qr-prod-modal-'+Date.now();
  modal(`<div style="text-align:center">
    <div style="margin-bottom:16px"><div style="font-family:var(--font-display);font-weight:800;font-size:1.2rem;margin-bottom:4px">${escapeStr(name)}</div><div style="color:var(--accent);font-family:var(--font-display);font-weight:700">${fmtCurrency(price)}</div></div>
    <div style="background:#f5f5f0;border-radius:20px;padding:24px;display:inline-block;margin-bottom:16px"><div id="${qrId}" style="background:white;padding:12px;border-radius:12px"></div></div>
  </div>`,{title:'QR del producto'});
  setTimeout(()=>{ const qrEl=document.getElementById(qrId); if(qrEl&&typeof QRCode!=='undefined') new QRCode(qrEl,{text:JSON.stringify({type:'product',id,name,price}),width:180,height:180}); },100);
}

const filterTable = (tbodyId, q, colIndexes) => document.querySelectorAll('#'+tbodyId+' tr').forEach(row => { const text=colIndexes.map(i=>row.cells[i]?.textContent||'').join(' ').toLowerCase(); row.style.display=text.includes(q.toLowerCase())?'':'none'; });
const escapeStr = str => String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');

SSE.connect();
showPanel('dashboard', document.querySelector('.nav-item[data-panel="dashboard"]'));
</script>
</body>
</html>
