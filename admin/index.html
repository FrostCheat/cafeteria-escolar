<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel Admin — Cafetería Escolar</title>
  <link rel="icon" href="/imgs/fav-icon.png" type="image/png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css"/>
  <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --c1: #0d0d0d;
      --c2: #111;
      --c3: #191919;
      --c4: #222;
      --accent: #ff3c00;
      --accent2: #ff6b35;
      --gold: #ffd166;
      --paper: #faf9f7;
      --cream: #f2ede4;
      --surface: #ffffff;
      --muted: #888;
      --border: rgba(0,0,0,0.08);
      --border-dark: rgba(255,255,255,0.07);
      --success: #06d6a0;
      --warning: #ffd166;
      --error: #ff3b5c;
      --info: #4cc9f0;
      --font-display: 'Unbounded', sans-serif;
      --font-body: 'Outfit', sans-serif;
      --radius: 16px;
      --radius-lg: 22px;
      --shadow: 0 4px 24px rgba(0,0,0,0.07);
      --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
      --spring: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
      --transition: all 0.2s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-font-smoothing: antialiased; }

    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--c1);
      overflow-x: hidden;
    }

    .admin-shell {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: calc(100dvh - 64px);
    }

    .sidebar {
      background: var(--c1);
      position: sticky;
      top: 64px;
      height: calc(100dvh - 64px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 20px 0;
    }

    .sidebar::-webkit-scrollbar { width: 0; }

    .sidebar-top {
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--border-dark);
      margin-bottom: 12px;
    }

    .sidebar-role {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-bottom: 4px;
    }

    .sidebar-name {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--paper);
    }

    .sidebar-section {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      padding: 10px 20px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 20px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.45);
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      position: relative;
    }

    .nav-item:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }

    .nav-item.active {
      background: rgba(255,60,0,0.15);
      color: var(--paper);
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 22px;
      background: var(--accent);
      border-radius: 0 3px 3px 0;
    }

    .nav-icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .nav-item.active .nav-icon { background: rgba(255,60,0,0.28); }

    .nav-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 8px 20px; }

    .main-content {
      background: var(--paper);
      min-height: calc(100dvh - 64px);
      overflow-y: auto;
    }

    .panel {
      padding: 28px 32px;
      max-width: 1400px;
      animation: panelIn 0.35s ease;
    }

    @keyframes panelIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      margin-bottom: 4px;
    }

    .panel-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .quick-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .quick-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      border-radius: 12px;
      border: none;
      font-family: var(--font-display);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: var(--spring);
    }

    .quick-btn:hover { transform: translateY(-2px); }
    .quick-btn:active { transform: scale(0.97); }

    .qb-accent { background: var(--accent); color: #fff; box-shadow: 0 4px 16px rgba(255,60,0,0.3); }
    .qb-accent:hover { box-shadow: 0 8px 28px rgba(255,60,0,0.45); }
    .qb-dark { background: var(--c1); color: var(--paper); }
    .qb-dark:hover { background: var(--c3); }
    .qb-outline { background: transparent; border: 1.5px solid var(--border); color: var(--c1); }
    .qb-outline:hover { border-color: var(--c1); background: var(--c1); color: var(--paper); }

    .section-label {
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .stats-grid {
      display: grid;
      gap: 14px;
      margin-bottom: 20px;
    }

    .stats-4 { grid-template-columns: repeat(4, 1fr); }
    .stats-6 { grid-template-columns: repeat(6, 1fr); }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: var(--transition);
    }

    .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }

    .stat-card::after {
      content: '';
      position: absolute;
      right: -16px;
      top: -16px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      opacity: 0.08;
    }

    .sc-accent::after { background: var(--accent); }
    .sc-success::after { background: var(--success); }
    .sc-info::after { background: var(--info); }
    .sc-warning::after { background: var(--warning); }

    .stat-label {
      font-family: var(--font-display);
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .stat-val {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .stat-sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .sv-accent { color: var(--accent); }
    .sv-success { color: var(--success); }
    .sv-info { color: var(--info); }
    .sv-warning { color: var(--warning); }
    .sv-error { color: var(--error); }

    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 24px;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
    }

    .chart-title {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 18px;
    }

    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      height: 110px;
    }

    .bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .bar {
      width: 100%;
      border-radius: 6px 6px 0 0;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent2) 100%);
      min-height: 4px;
      cursor: pointer;
      transition: opacity 0.2s ease, height 0.6s cubic-bezier(0.34,1.56,0.64,1);
      position: relative;
    }

    .bar:hover { opacity: 0.8; }

    .bar-label {
      font-size: 0.58rem;
      color: var(--muted);
      text-align: center;
      white-space: nowrap;
      font-family: var(--font-display);
      font-weight: 600;
    }

    .top-product-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .tp-rank {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 900;
      color: var(--muted);
      width: 16px;
      flex-shrink: 0;
    }

    .tp-info { flex: 1; min-width: 0; }

    .tp-name {
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .tp-bar-wrap {
      height: 5px;
      background: var(--cream);
      border-radius: 3px;
      overflow: hidden;
    }

    .tp-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1);
    }

    .tp-count {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .s-input {
      padding: 10px 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      font-family: var(--font-body);
      font-size: 0.875rem;
      min-width: 200px;
      outline: none;
      transition: all 0.2s ease;
      background: var(--surface);
    }

    .s-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,60,0,0.08); }

    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: var(--surface);
    }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      background: var(--cream);
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 12px 16px;
      text-align: left;
      white-space: nowrap;
    }

    tbody td {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 0.875rem;
      vertical-align: middle;
    }

    tbody tr { transition: background 0.15s ease; }
    tbody tr:hover td { background: rgba(255,60,0,0.02); }

    .prod-thumb {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      overflow: hidden;
      flex-shrink: 0;
    }

    .prod-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 100px;
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .sp-paid { background: rgba(6,214,160,0.12); color: #04a87d; }
    .sp-pending { background: rgba(255,209,102,0.15); color: #b08800; }
    .sp-cancelled { background: rgba(255,59,92,0.12); color: var(--error); }
    .sp-active { background: rgba(6,214,160,0.12); color: #04a87d; }
    .sp-inactive { background: rgba(255,59,92,0.12); color: var(--error); }
    .sp-blocked { background: rgba(255,59,92,0.12); color: var(--error); }

    .act-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 14px;
      border-radius: 10px;
      border: none;
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: var(--spring);
    }

    .act-btn:hover { transform: scale(1.05); }
    .act-btn:active { transform: scale(0.97); }

    .ab-ghost { background: var(--cream); color: var(--c1); }
    .ab-ghost:hover { background: var(--c1); color: var(--paper); }
    .ab-success { background: rgba(6,214,160,0.12); color: #04a87d; }
    .ab-success:hover { background: var(--success); color: #fff; }
    .ab-danger { background: rgba(255,59,92,0.1); color: var(--error); }
    .ab-danger:hover { background: var(--error); color: #fff; }
    .ab-warning { background: rgba(255,209,102,0.15); color: #b08800; }
    .ab-warning:hover { background: var(--warning); color: var(--c1); }
    .ab-accent { background: var(--accent); color: #fff; }
    .ab-primary { background: var(--c1); color: var(--paper); }

    .scanner-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }

    .scanner-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
    }

    .scanner-box-title {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 14px;
    }

    .scan-tabs {
      display: flex;
      background: var(--cream);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 18px;
      gap: 2px;
    }

    .scan-tab {
      flex: 1;
      padding: 9px 6px;
      border: none;
      border-radius: 8px;
      background: transparent;
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s ease;
    }

    .scan-tab.active { background: var(--c1); color: var(--paper); }

    .cam-wrap {
      border-radius: var(--radius);
      overflow: hidden;
      background: #0a0a0a;
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #qr-reader { width: 100% !important; border: none !important; }
    #qr-reader video { width: 100% !important; object-fit: cover !important; }
    #qr-reader img { display: none !important; }
    #qr-reader__scan_region { border: none !important; }
    #qr-reader__dashboard { background: transparent !important; border: none !important; padding: 8px 0 0 !important; }
    #qr-reader__dashboard_section_csr button {
      background: var(--accent) !important; color: white !important; border: none !important;
      border-radius: 10px !important; padding: 8px 16px !important; cursor: pointer !important;
    }
    #qr-reader__dashboard_section_fsr { display: none !important; }
    #qr-reader__status_span { font-size: .75rem !important; color: var(--muted) !important; }

    .cam-placeholder {
      text-align: center;
      color: rgba(255,255,255,0.3);
      padding: 40px 24px;
    }

    .cam-placeholder-icon { font-size: 3rem; margin-bottom: 12px; }
    .cam-placeholder-text { font-size: 0.8rem; line-height: 1.6; }

    .cam-controls {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .manual-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .manual-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-family: var(--font-body);
      font-size: 0.875rem;
      outline: none;
      transition: all 0.2s;
    }

    .manual-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,60,0,0.08); }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-card.has-result {
      align-items: flex-start;
      animation: panelIn 0.3s ease;
    }

    .result-empty {
      text-align: center;
      color: var(--muted);
    }

    .result-empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .result-empty-title { font-family: var(--font-display); font-size: 0.9rem; font-weight: 700; margin-bottom: 6px; }
    .result-empty-sub { font-size: 0.8rem; }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
      width: 100%;
    }

    .result-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-bottom: 16px;
    }

    .rmeta-label {
      font-family: var(--font-display);
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .rmeta-val { font-size: 0.875rem; font-weight: 600; }

    .result-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
      margin-top: 16px;
    }

    .low-stock-alert {
      background: #fffbf0;
      border: 1px solid rgba(255,209,102,0.4);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 20px;
    }

    .low-stock-title {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      color: #8a5a00;
      margin-bottom: 8px;
    }

    .stock-chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .stock-chip {
      padding: 4px 10px;
      border-radius: 100px;
      background: rgba(255,209,102,0.2);
      color: #8a5a00;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .pending-rev-card {
      background: var(--c1);
      color: var(--paper);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      display: flex;
      gap: 24px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pr-amount {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--warning);
      letter-spacing: -0.04em;
    }

    .pr-label {
      font-size: 0.68rem;
      font-weight: 700;
      font-family: var(--font-display);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 4px;
    }

    .pr-sub { font-size: 0.8rem; color: rgba(255,255,255,0.45); flex: 1; min-width: 160px; line-height: 1.6; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-grid .full { grid-column: 1 / -1; }

    .field-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }

    .field-label {
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .field-input {
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-family: var(--font-body);
      font-size: 0.875rem;
      outline: none;
      transition: all 0.2s;
    }

    .field-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,60,0,0.08); }

    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--c1);
      border-top: 1px solid var(--border-dark);
      z-index: 100;
      padding: 8px 0 env(safe-area-inset-bottom, 0);
    }

    .mbn-inner {
      display: flex;
      justify-content: space-around;
    }

    .mbn-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.35);
      font-family: var(--font-display);
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mbn-btn.active { color: var(--accent); }
    .mbn-icon { font-size: 1.3rem; }

    .cam-perm-tip {
      background: #fff8f0;
      border: 1px solid #f0c070;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.78rem;
      color: #6a4400;
      margin-top: 10px;
      display: none;
    }

    @media (max-width: 1100px) {
      .stats-4 { grid-template-columns: repeat(2, 1fr); }
      .stats-6 { grid-template-columns: repeat(3, 1fr); }
      .charts-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 900px) {
      .admin-shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .mobile-bottom-nav { display: block; }
      .main-content { padding-bottom: 72px; }
      .panel { padding: 16px 16px; }
      .scanner-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .stats-4 { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .stats-6 { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .s-input { min-width: unset; }
      .result-meta { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .stats-6 { grid-template-columns: repeat(2, 1fr); }
      .stat-val { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
<nav class="nav" id="main-nav"></nav>

<div class="admin-shell">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-role">Panel de control</div>
      <div class="sidebar-name">Administrador</div>
    </div>

    <div class="sidebar-section">Principal</div>
    <button class="nav-item active" data-panel="dashboard" onclick="showPanel('dashboard',this)">
      <div class="nav-icon">📊</div> Dashboard
    </button>

    <div class="nav-divider"></div>
    <div class="sidebar-section">Escanear</div>
    <button class="nav-item" data-panel="scanner" onclick="showPanel('scanner',this)">
      <div class="nav-icon">📷</div> Escanear QR
    </button>

    <div class="nav-divider"></div>
    <div class="sidebar-section">Gestión</div>
    <button class="nav-item" data-panel="products" onclick="showPanel('products',this)">
      <div class="nav-icon">📦</div> Productos
    </button>
    <button class="nav-item" data-panel="users" onclick="showPanel('users',this)">
      <div class="nav-icon">👥</div> Usuarios
    </button>
    <button class="nav-item" data-panel="orders" onclick="showPanel('orders',this)">
      <div class="nav-icon">📋</div> Pedidos
    </button>
  </aside>

  <main class="main-content" id="admin-main">
    <div style="display:flex;justify-content:center;padding:64px">
      <div style="width:36px;height:36px;border:3px solid rgba(0,0,0,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite"></div>
    </div>
  </main>
</div>

<div class="mobile-bottom-nav">
  <div class="mbn-inner">
    <button class="mbn-btn active" onclick="showPanel('dashboard',null,'dashboard')">
      <span class="mbn-icon">📊</span>Dashboard
    </button>
    <button class="mbn-btn" onclick="showPanel('scanner',null,'scanner')">
      <span class="mbn-icon">📷</span>Escáner
    </button>
    <button class="mbn-btn" onclick="showPanel('products',null,'products')">
      <span class="mbn-icon">📦</span>Productos
    </button>
    <button class="mbn-btn" onclick="showPanel('users',null,'users')">
      <span class="mbn-icon">👥</span>Usuarios
    </button>
    <button class="mbn-btn" onclick="showPanel('orders',null,'orders')">
      <span class="mbn-icon">📋</span>Pedidos
    </button>
  </div>
</div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script src="../assets/js/app.js"></script>
<script>
auth.requireAdmin();
buildNav('admin');

let html5QrCode = null;
let isScanning = false;
let currentScanType = 'order';
let lastScanned = '';
let lastScannedTime = 0;

const panels = ['dashboard','scanner','products','users','orders'];

function showPanel(name, btn, mobilePanel) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else document.querySelector(`.nav-item[data-panel="${name}"]`)?.classList.add('active');

  const pName = mobilePanel || name;
  document.querySelectorAll('.mbn-btn').forEach((b, i) => b.classList.toggle('active', panels[i] === pName));

  stopCamera();

  const el = document.getElementById('admin-main');
  el.innerHTML = `<div style="display:flex;justify-content:center;padding:64px"><div style="width:36px;height:36px;border:3px solid rgba(0,0,0,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite"></div></div>`;

  if (name === 'dashboard') renderDashboard(el);
  else if (name === 'products') renderProducts(el);
  else if (name === 'users') renderUsers(el);
  else if (name === 'orders') renderOrders(el);
  else if (name === 'scanner') renderScanner(el);
}

function setPanel(el, html) {
  el.innerHTML = `<div class="panel">${html}</div>`;
}

async function renderDashboard(el) {
  let stats, allOrders = [], products = [];
  try {
    [stats, allOrders, products] = await Promise.all([
      api.get('/orders/stats'),
      api.get('/orders'),
      api.get('/products?all=1'),
    ]);
  } catch(e) {
    setPanel(el, `<div class="panel-title">Dashboard</div><div style="color:var(--error)">${e.message}</div>`);
    return;
  }

  const now = new Date();
  const todayStr = now.toISOString().slice(0,10);
  const monthStr = now.toISOString().slice(0,7);
  const yearStr  = now.getFullYear().toString();
  const paidOrders = allOrders.filter(o => o.status === 'paid');

  const revByPeriod = (orders, period) =>
    orders.filter(o => o.created_at?.startsWith(period)).reduce((s,o) => s + parseFloat(o.total || 0), 0);
  const countByPeriod = (orders, period) =>
    orders.filter(o => o.created_at?.startsWith(period)).length;

  const revToday = revByPeriod(paidOrders, todayStr);
  const revMonth = revByPeriod(paidOrders, monthStr);
  const revYear  = revByPeriod(paidOrders, yearStr);
  const revTotal = paidOrders.reduce((s,o) => s + parseFloat(o.total || 0), 0);

  const monthlyData = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.toISOString().slice(0,7);
    const label = d.toLocaleDateString('es-CO', {month:'short'});
    monthlyData.push({ label, rev: revByPeriod(paidOrders, key) });
  }

  const totalStock  = products.reduce((s,p) => s + parseInt(p.stock || 0), 0);
  const activeProds = products.filter(p => p.active).length;
  const lowStock    = products.filter(p => p.active && parseInt(p.stock) <= 3);

  const productSales = {};
  allOrders.forEach(o => {
    (o.items || []).forEach(i => {
      productSales[i.product_name] = (productSales[i.product_name] || 0) + parseInt(i.quantity || 1);
    });
  });
  const topProducts = Object.entries(productSales).sort((a,b) => b[1]-a[1]).slice(0,5);
  const maxRev = Math.max(...monthlyData.map(m => m.rev), 1);

  const totalOrders    = parseInt(stats.total_orders   || 0);
  const paidCount      = parseInt(stats.paid_orders    || 0);
  const pendingCount   = parseInt(stats.pending_orders || 0);
  const cancelledCount = parseInt(stats.cancelled_orders || 0);
  const totalUsers     = parseInt(stats.total_users    || 0);
  const pendingRev     = parseFloat(stats.pending_revenue || 0);
  const paidRev        = parseFloat(stats.total_revenue   || 0);

  setPanel(el, `
    <div class="panel-title">Dashboard</div>
    <div class="panel-sub">${new Date().toLocaleDateString('es-CO', {weekday:'long', year:'numeric', month:'long', day:'numeric'})}</div>

    <div class="quick-row">
      <button class="quick-btn qb-accent" onclick="showPanel('scanner')">📷 Escanear QR</button>
      <button class="quick-btn qb-dark" onclick="showPanel('orders')">📋 Ver pedidos</button>
      <button class="quick-btn qb-outline" onclick="showPanel('products')">📦 Productos</button>
      <button class="quick-btn qb-outline" onclick="showPanel('users')">👥 Usuarios</button>
    </div>

    <div class="section-label">💰 Ganancias cobradas</div>
    <div class="stats-grid stats-4" style="margin-bottom:20px">
      <div class="stat-card sc-success">
        <div class="stat-label"><span class="stat-dot" style="background:var(--success)"></span>Hoy</div>
        <div class="stat-val sv-success">${fmtCurrency(revToday)}</div>
        <div class="stat-sub">${countByPeriod(paidOrders, todayStr)} pagados</div>
      </div>
      <div class="stat-card sc-success">
        <div class="stat-label"><span class="stat-dot" style="background:var(--success)"></span>Este mes</div>
        <div class="stat-val sv-success">${fmtCurrency(revMonth)}</div>
        <div class="stat-sub">${countByPeriod(paidOrders, monthStr)} pagados</div>
      </div>
      <div class="stat-card sc-success">
        <div class="stat-label"><span class="stat-dot" style="background:var(--success)"></span>Este año</div>
        <div class="stat-val sv-success">${fmtCurrency(revYear)}</div>
        <div class="stat-sub">${countByPeriod(paidOrders, yearStr)} pagados</div>
      </div>
      <div class="stat-card sc-success">
        <div class="stat-label"><span class="stat-dot" style="background:var(--success)"></span>Total histórico</div>
        <div class="stat-val sv-success">${fmtCurrency(revTotal)}</div>
        <div class="stat-sub">${paidOrders.length} pagados</div>
      </div>
    </div>

    <div class="section-label">🛒 Pedidos</div>
    <div class="stats-grid stats-6" style="margin-bottom:20px">
      <div class="stat-card sc-success">
        <div class="stat-label"><span class="stat-dot" style="background:var(--success)"></span>Pagados</div>
        <div class="stat-val sv-success">${paidCount}</div>
      </div>
      <div class="stat-card sc-warning">
        <div class="stat-label"><span class="stat-dot" style="background:var(--warning)"></span>Pendientes</div>
        <div class="stat-val sv-warning">${pendingCount}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label"><span class="stat-dot" style="background:var(--error)"></span>Cancelados</div>
        <div class="stat-val sv-error">${cancelledCount}</div>
      </div>
      <div class="stat-card sc-info">
        <div class="stat-label"><span class="stat-dot" style="background:var(--info)"></span>Productos activos</div>
        <div class="stat-val sv-info">${activeProds}</div>
      </div>
      <div class="stat-card sc-info">
        <div class="stat-label"><span class="stat-dot" style="background:var(--info)"></span>Stock total</div>
        <div class="stat-val sv-info">${totalStock}</div>
        <div class="stat-sub">unidades</div>
      </div>
      <div class="stat-card sc-info">
        <div class="stat-label"><span class="stat-dot" style="background:var(--info)"></span>Usuarios</div>
        <div class="stat-val sv-info">${totalUsers}</div>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">📈 Ganancias últimos 6 meses</div>
        <div class="bar-chart">
          ${monthlyData.map(m => `
            <div class="bar-wrap">
              <div class="bar" style="height:${Math.max(8,(m.rev/maxRev)*100)}px" title="${fmtCurrency(m.rev)}"></div>
              <div class="bar-label">${m.label}</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-title">🏆 Productos más vendidos</div>
        ${topProducts.length ? topProducts.map(([name, qty], i) => `
          <div class="top-product-row">
            <span class="tp-rank">${i+1}</span>
            <div class="tp-info">
              <div class="tp-name">${name}</div>
              <div class="tp-bar-wrap">
                <div class="tp-bar" style="width:${(qty/(topProducts[0][1]||1)*100)}%"></div>
              </div>
            </div>
            <span class="tp-count">${qty} uds</span>
          </div>
        `).join('') : '<div style="font-size:0.85rem;color:var(--muted)">Sin datos de ventas aún</div>'}
      </div>
    </div>

    ${lowStock.length ? `
      <div class="low-stock-alert">
        <div class="low-stock-title">⚠️ Stock bajo (≤3 unidades)</div>
        <div class="stock-chips">
          ${lowStock.map(p => `<span class="stock-chip">${p.name} (${p.stock})</span>`).join('')}
        </div>
      </div>
    ` : ''}

    <div class="pending-rev-card">
      <div>
        <div class="pr-label">Ingresos pendientes</div>
        <div class="pr-amount">${fmtCurrency(Math.max(0, pendingRev - paidRev))}</div>
      </div>
      <p class="pr-sub">Pedidos pendientes de cobro. Escanea los QR para registrar pagos.</p>
      <button class="quick-btn qb-accent" onclick="showPanel('scanner')">📷 Ir al escáner</button>
    </div>
  `);
}

function renderScanner(el) {
  setPanel(el, `
    <div class="panel-title">Escanear QR</div>
    <div class="panel-sub">Apunta la cámara al código — detección automática</div>

    <div class="scan-tabs">
      <button class="scan-tab active" onclick="setScanType('order',this)">🧾 Pedidos</button>
      <button class="scan-tab" onclick="setScanType('user',this)">👤 Usuarios</button>
      <button class="scan-tab" onclick="setScanType('product',this)">📦 Productos</button>
    </div>

    <div class="scanner-grid">
      <div>
        <div class="scanner-box" style="margin-bottom:14px">
          <div class="scanner-box-title">📹 Cámara</div>
          <div class="cam-wrap">
            <div id="qr-reader-placeholder" class="cam-placeholder">
              <div class="cam-placeholder-icon">📷</div>
              <div class="cam-placeholder-text">Toca "Activar cámara"<br/>para escanear</div>
            </div>
            <div id="qr-reader" style="width:100%;display:none;"></div>
          </div>
          <div class="cam-controls">
            <button class="quick-btn qb-accent" id="btn-start-cam" onclick="startCamera()">▶ Activar cámara</button>
            <button class="quick-btn qb-outline" id="btn-stop-cam" style="display:none" onclick="stopCamera()">⏹ Detener</button>
          </div>
          <div class="cam-perm-tip" id="cam-perm-tip">
            <strong>📋 Permitir cámara:</strong> Toca el ícono 🔒 en la barra de direcciones. En Safari iOS: Configuración → Safari → Cámara → Permitir.
          </div>
        </div>

        <div class="scanner-box">
          <div class="scanner-box-title">⌨️ Ingresar manualmente</div>
          <div class="manual-row">
            <input class="manual-input" id="manual-token" placeholder="Token, ID o número de documento..."/>
            <button class="quick-btn qb-dark" onclick="manualSearch()">Buscar</button>
          </div>
        </div>
      </div>

      <div>
        <div class="scanner-box-title">📋 Resultado</div>
        <div class="result-card" id="scan-result">
          <div class="result-empty">
            <div class="result-empty-icon">🔍</div>
            <div class="result-empty-title">Sin resultado</div>
            <div class="result-empty-sub">Escanea un QR o ingresa un token/ID</div>
          </div>
        </div>
      </div>
    </div>
  `);

  document.getElementById('manual-token').addEventListener('keydown', e => {
    if (e.key === 'Enter') manualSearch();
  });
}

function setScanType(type, btn) {
  currentScanType = type;
  document.querySelectorAll('.scan-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  clearScanResult();
  const placeholders = { order: 'Token del QR o ID del pedido...', user: 'Número de documento del estudiante...', product: 'ID del producto...' };
  const inp = document.getElementById('manual-token');
  if (inp) inp.placeholder = placeholders[type] || '';
}

function clearScanResult() {
  const r = document.getElementById('scan-result');
  if (!r) return;
  r.className = 'result-card';
  r.innerHTML = `<div class="result-empty"><div class="result-empty-icon">🔍</div><div class="result-empty-title">Sin resultado</div><div class="result-empty-sub">Escanea un QR o ingresa un token/ID</div></div>`;
}

async function manualSearch() {
  const token = (document.getElementById('manual-token')?.value || '').trim();
  if (!token) { toast('Ingresa un valor para buscar', 'warning'); return; }
  await processScanResult(token);
}

function extractTokenFromQR(raw) {
  if (!raw) return null;
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch(e) {}
  if (!parsed) {
    try {
      const base64 = raw.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '==='.slice((base64.length + 3) % 4);
      parsed = JSON.parse(atob(padded));
    } catch(e) {}
  }
  if (parsed) return { token: parsed.token || null, type: parsed.type || null, id: parsed.id || null, raw: parsed };
  return { token: raw, type: null, id: null, raw: null };
}

async function processScanResult(raw) {
  const resultEl = document.getElementById('scan-result');
  if (!resultEl) return;
  resultEl.className = 'result-card';
  resultEl.innerHTML = `<div style="display:flex;justify-content:center;width:100%"><div style="width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite"></div></div>`;
  const extracted = extractTokenFromQR(raw);
  let type = currentScanType;
  if (extracted.type === 'order') type = 'order';
  else if (extracted.type === 'product') type = 'product';
  try {
    if (type === 'order') await showOrderResult(extracted.token || raw, resultEl);
    else if (type === 'product') await showProductResult(extracted.id || parseInt(raw), resultEl);
    else await showUserResult(raw, resultEl);
  } catch(e) {
    resultEl.className = 'result-card';
    resultEl.innerHTML = `<div style="text-align:center;width:100%"><div style="font-size:2rem;margin-bottom:8px">❌</div><div style="font-family:var(--font-display);font-weight:700;color:var(--error);margin-bottom:6px">No encontrado</div><div style="font-size:0.8rem;color:var(--muted)">${e.message}</div></div>`;
  }
}

function statusPill(s) {
  const map = { pending: ['sp-pending','⏳','Pendiente'], paid: ['sp-paid','✅','Pagado'], cancelled: ['sp-cancelled','❌','Cancelado'] };
  const [cls, ic, label] = map[s] || ['','?',s];
  return `<span class="status-pill ${cls}">${ic} ${label}</span>`;
}

function statusBadge(s) { return statusPill(s); }

async function showOrderResult(token, el) {
  const o = await api.get('/orders/scan/' + encodeURIComponent(token));
  el.className = 'result-card has-result';
  const qrId = 'res-qr-' + Date.now();
  el.innerHTML = `
    <div style="width:100%">
      <div class="result-header">
        <div>
          <div style="font-family:var(--font-display);font-weight:900;font-size:1rem;letter-spacing:-0.02em">Pedido #${o.id}</div>
          <div style="font-size:0.75rem;color:var(--muted)">${fmtDate(o.created_at)}</div>
        </div>
        ${statusPill(o.status)}
      </div>
      <div class="result-meta">
        <div><div class="rmeta-label">Estudiante</div><div class="rmeta-val">${o.full_name}</div></div>
        <div><div class="rmeta-label">Grado</div><div class="rmeta-val">${o.grade}</div></div>
        <div><div class="rmeta-label">Documento</div><div class="rmeta-val">${o.doc_type} ${o.doc_number}</div></div>
        <div><div class="rmeta-label">Total</div><div class="rmeta-val" style="color:var(--accent);font-family:var(--font-display);font-weight:900">${fmtCurrency(o.total)}</div></div>
      </div>
      <div style="margin-bottom:14px">
        <div style="font-family:var(--font-display);font-size:0.6rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Productos:</div>
        ${(o.items||[]).map(i => `
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:0.85rem">
            <span>${i.product_name}</span><span style="color:var(--muted)">×${i.quantity}</span><span style="color:var(--accent);font-weight:700">${fmtCurrency(i.subtotal)}</span>
          </div>`).join('')}
      </div>
      <div id="${qrId}" style="text-align:center;margin-bottom:12px"></div>
      <div class="result-actions">
        ${o.status !== 'paid' ? `<button class="act-btn ab-success" onclick="setOrderStatus(${o.id},'paid',true)">✅ Marcar pagado</button>` : ''}
        ${o.status === 'pending' ? `<button class="act-btn ab-danger" onclick="setOrderStatus(${o.id},'cancelled',true)">❌ Cancelar</button>` : ''}
        ${o.status !== 'pending' ? `<button class="act-btn ab-warning" onclick="setOrderStatus(${o.id},'pending',true)">⏳ Pendiente</button>` : ''}
      </div>
    </div>`;
  setTimeout(() => {
    const qrEl = document.getElementById(qrId);
    if (qrEl && typeof QRCode !== 'undefined') {
      new QRCode(qrEl, { text: JSON.stringify({ token: o.qr_token, orderId: o.id }), width: 110, height: 110 });
    }
  }, 80);
}

async function showProductResult(id, el) {
  if (!id || isNaN(id)) throw new Error('ID de producto inválido');
  const p = await api.get('/products/' + id);
  el.className = 'result-card has-result';
  const qrId = 'res-qr-' + Date.now();
  el.innerHTML = `
    <div style="width:100%">
      <div class="result-header">
        <div>
          <div style="font-family:var(--font-display);font-weight:900;font-size:1rem">${p.name}</div>
          <span style="font-size:0.75rem;color:var(--muted)">${p.category}</span>
        </div>
        ${p.active ? '<span class="status-pill sp-active">✓ Activo</span>' : '<span class="status-pill sp-inactive">✕ Inactivo</span>'}
      </div>
      <div class="result-meta">
        <div><div class="rmeta-label">Precio</div><div class="rmeta-val" style="color:var(--accent);font-family:var(--font-display);font-weight:900">${fmtCurrency(p.price)}</div></div>
        <div><div class="rmeta-label">Stock</div><div class="rmeta-val" style="color:${p.stock>5?'var(--success)':p.stock>0?'var(--warning)':'var(--error)'}">${p.stock} unidades</div></div>
        <div><div class="rmeta-label">ID</div><div class="rmeta-val">#${p.id}</div></div>

async function startCamera() {
  const tipEl = document.getElementById('cam-perm-tip');
  if (tipEl) tipEl.style.display = 'none';
  const placeholder = document.getElementById('qr-reader-placeholder');
  const readerEl = document.getElementById('qr-reader');
  if (!readerEl) return;
  if (html5QrCode) { try { await html5QrCode.stop(); } catch(e) {} html5QrCode = null; }
  html5QrCode = new Html5Qrcode('qr-reader');
  const config = { fps: 10, qrbox: { width: 220, height: 220 }, aspectRatio: 1.333 };
  const onScanSuccess = async (decodedText) => {
    const now = Date.now();
    if (decodedText === lastScanned && now - lastScannedTime < 4000) return;
    lastScanned = decodedText;
    lastScannedTime = now;
    await stopCamera();
    toast('✓ QR detectado', 'success');
    await processScanResult(decodedText);
  };
  try {
    if (placeholder) placeholder.style.display = 'none';
    readerEl.style.display = 'block';
    await html5QrCode.start({ facingMode: 'environment' }, config, onScanSuccess, () => {});
    isScanning = true;
    document.getElementById('btn-start-cam').style.display = 'none';
    document.getElementById('btn-stop-cam').style.display = '';
  } catch(err) {
    readerEl.style.display = 'none';
    if (placeholder) placeholder.style.display = '';
    if (tipEl) tipEl.style.display = 'block';
    toast('No se pudo acceder a la cámara.', 'error');
    html5QrCode = null;
    isScanning = false;
  }
}

async function stopCamera() {
  if (html5QrCode && isScanning) { try { await html5QrCode.stop(); } catch(e) {} html5QrCode = null; }
  isScanning = false;
  const placeholder = document.getElementById('qr-reader-placeholder');
  const readerEl = document.getElementById('qr-reader');
  const startBtn = document.getElementById('btn-start-cam');
  const stopBtn  = document.getElementById('btn-stop-cam');
  if (readerEl) readerEl.style.display = 'none';
  if (placeholder) placeholder.style.display = '';
  if (startBtn) startBtn.style.display = '';
  if (stopBtn) stopBtn.style.display = 'none';
}

      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${o.status !== 'paid' ? `<button class="act-btn ab-success" onclick="setOrderStatus(${o.id},'paid',true)">✅ Marcar pagado</button>` : ''}
        <button class="act-btn ab-warning" onclick="setOrderStatus(${o.id},'pending',true)">⏳ Pendiente</button>
        <button class="act-btn ab-danger" onclick="setOrderStatus(${o.id},'cancelled',true)">❌ Cancelar</button>
      </div>
    </div>
  `, { title: `Pedido #${o.id}` });
  setTimeout(() => {
    const qrEl = document.getElementById(qrId);
    if (qrEl && typeof QRCode !== 'undefined') {
      new QRCode(qrEl, { text: JSON.stringify({ token: o.qr_token, orderId: o.id }), width: 140, height: 140 });
    }
  }, 100);
}

async function setOrderStatus(id, status, fromModal = false) {
  try {
    await api.put('/orders/' + id + '/status', { status });
    toast('Estado actualizado: ' + status, 'success');
    if (fromModal) document.querySelector('.modal-overlay')?.remove();
    showPanel('orders');
  } catch(e) { toast(e.message, 'error'); }
}

function filterTable(tbodyId, q, colIndexes) {
  document.querySelectorAll('#' + tbodyId + ' tr').forEach(row => {
    const text = colIndexes.map(i => row.cells[i]?.textContent || '').join(' ').toLowerCase();
    row.style.display = text.includes(q.toLowerCase()) ? '' : 'none';
  });
}

function escapeStr(str) {
  return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
}

showPanel('dashboard', document.querySelector('.nav-item[data-panel="dashboard"]'));
</script>
</body>
</html>
