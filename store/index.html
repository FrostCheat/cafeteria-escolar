<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cafetería — Santa Juana</title>
  <link rel="icon" href="/imgs/fav-icon.png" type="image/png"/>
  <link rel="stylesheet" href="/assets/css/main.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .store-layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 64px); }
    .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 28px 16px; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; }
    .sidebar-title { font-family: 'Syne', sans-serif; font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
    .cat-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: none; background: transparent; border-radius: var(--radius); font-size: .9rem; cursor: pointer; text-align: left; transition: all .15s; color: var(--ink); }
    .cat-btn:hover { background: var(--cream); }
    .cat-btn.active { background: var(--ink); color: var(--paper); }
    .main-tabs { display: flex; border-bottom: 2px solid var(--border); padding: 0 32px; background: var(--surface); }
    .main-tab { padding: 16px 20px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: .875rem; background: none; border: none; color: var(--muted); cursor: pointer; position: relative; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color .2s; }
    .main-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { padding: 32px; display: none; }
    .tab-content.active { display: block; }
    .product-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; transition: all .2s; display: flex; flex-direction: column; }
    .product-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .product-img { height: 150px; background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 3.5rem; overflow: hidden; }
    .product-img img { width: 100%; height: 100%; object-fit: cover; }
    .product-body { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; }
    .product-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: .95rem; margin-bottom: 4px; }
    .product-desc { font-size: .82rem; color: var(--muted); margin-bottom: 8px; flex: 1; line-height: 1.5; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 8px; }
    .product-price { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--accent); }
    .search-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; }
    .search-input { flex: 1; padding: 10px 16px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: .95rem; transition: border-color .2s; }
    .search-input:focus { outline: none; border-color: var(--accent); }
    .cart-item { display: flex; align-items: center; gap: 16px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .cart-item-img { width: 52px; height: 52px; background: var(--cream); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; overflow: hidden; }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .qty-ctrl { display: flex; align-items: center; gap: 8px; }
    .qty-btn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--cream); cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .qty-btn:hover { background: var(--border); }
    .qty-num { font-family: 'Syne', sans-serif; font-weight: 700; min-width: 24px; text-align: center; }
    .cart-summary { background: var(--ink); color: var(--paper); border-radius: var(--radius-lg); padding: 28px; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: .88rem; color: rgba(247,243,236,.65); }
    .summary-total { display: flex; justify-content: space-between; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; padding-top: 14px; border-top: 1px solid rgba(247,243,236,.15); margin-top: 6px; }
    .order-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 24px; }
    .order-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .qr-area { text-align: center; padding: 20px; background: var(--cream); border-radius: var(--radius-lg); border: 2px dashed var(--border); }
    .cat-divider { height: 1px; background: var(--border); margin: 10px 0; }
    @media(max-width:900px) { .store-layout { grid-template-columns:1fr; } .sidebar { display:none; } .tab-content { padding: 20px; } }
  </style>
</head>
<body>
<nav class="nav" id="main-nav"></nav>

<div class="store-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-title">Menú del día</div>
    <button class="cat-btn active" data-cat="" onclick="filterCat(this,'')">🍽️ Todo</button>
    <div class="cat-divider"></div>
    <div class="sidebar-title" style="margin-top:10px">Comidas</div>
    <button class="cat-btn" data-cat="almuerzos"  onclick="filterCat(this,'almuerzos')">🍛 Almuerzos</button>
    <button class="cat-btn" data-cat="desayunos"  onclick="filterCat(this,'desayunos')">🍳 Desayunos</button>
    <button class="cat-btn" data-cat="rapidos"    onclick="filterCat(this,'rapidos')">🌭 Platos Rápidos</button>
    <div class="cat-divider"></div>
    <div class="sidebar-title" style="margin-top:10px">Extras</div>
    <button class="cat-btn" data-cat="bebidas"    onclick="filterCat(this,'bebidas')">🥤 Bebidas</button>
    <button class="cat-btn" data-cat="snacks"     onclick="filterCat(this,'snacks')">🍿 Snacks</button>
    <button class="cat-btn" data-cat="postres"    onclick="filterCat(this,'postres')">🍮 Postres</button>
    <button class="cat-btn" data-cat="general"    onclick="filterCat(this,'general')">📦 General</button>
  </aside>

  <div>
    <div class="main-tabs">
      <button class="main-tab active" onclick="switchTab('products')">🍽️ Carta</button>
      <button class="main-tab" onclick="switchTab('cart')" id="tab-cart-btn">🛒 Pedido <span id="tab-cart-count" style="color:var(--accent)"></span></button>
      <button class="main-tab" onclick="switchTab('orders')">📋 Mis Pedidos</button>
    </div>

    <!-- Products tab -->
    <div class="tab-content active" id="tab-products">
      <div class="search-bar">
        <input class="search-input" id="search" placeholder="Buscar en el menú..." oninput="searchProducts(this.value)"/>
        <span id="product-count" class="text-muted text-sm"></span>
      </div>
      <div class="grid-auto" id="products-grid">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- Cart tab -->
    <div class="tab-content" id="tab-cart">
      <div id="cart-content"><div class="loading"><div class="spinner"></div></div></div>
    </div>

    <!-- Orders tab -->
    <div class="tab-content" id="tab-orders">
      <div id="orders-content"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>
</div>

<script src="/assets/js/app.js"></script>
<script>
  buildNav('store');

  let allProducts = [];
  let currentCat = new URLSearchParams(location.search).get('cat') || '';
  let cartData   = [];

  const activeTab = location.hash === '#cart' ? 'cart' : location.hash === '#orders' ? 'orders' : 'products';


  function getCatIcon(cat) {
    const icons = {
      almuerzos: '🍛', desayunos: '🍳', rapidos: '🌭',
      bebidas: '🥤', snacks: '🍿', postres: '🍮', general: '🍽️'
    };
    return icons[cat] || '🍽️';
  }

  function getCatLabel(cat) {
    const labels = {
      almuerzos: 'Almuerzo', desayunos: 'Desayuno', rapidos: 'Plato Rápido',
      bebidas: 'Bebida', snacks: 'Snack', postres: 'Postre', general: 'General'
    };
    return labels[cat] || cat;
  }

  async function init() {
    await loadProducts();
    if (auth.isLoggedIn()) {
      await loadCart();
      if (activeTab !== 'products') switchTab(activeTab);
    }

    if (currentCat) {
      const catBtn = document.querySelector(`.cat-btn[data-cat="${currentCat}"]`);
      if (catBtn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        catBtn.classList.add('active');
        filterCat(catBtn, currentCat);
      }
    }
  }

  async function loadProducts() {
    try {
      allProducts = await api.get('/products');
      renderProducts(allProducts);
    } catch (e) { toast('Error al cargar el menú', 'error'); }
  }

  function renderProducts(products) {
    const grid = document.getElementById('products-grid');
    const filtered = currentCat ? products.filter(p => p.category === currentCat) : products;
    document.getElementById('product-count').textContent = filtered.length + ' artículo(s)';

    if (!filtered.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🍽️</div><h3>Sin productos</h3><p>No hay artículos en esta categoría por ahora</p></div>';
      return;
    }

    grid.innerHTML = filtered.map(p => `
      <div class="product-card">
        <div class="product-img">
          ${p.image ? `<img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='${getCatIcon(p.category)}'">` : getCatIcon(p.category)}
        </div>
        <div class="product-body">
          <div class="tag" style="margin-bottom:6px">${getCatLabel(p.category)}</div>
          <div class="product-name">${p.name}</div>
          <div class="product-desc">${p.description || ''}</div>
          <div class="product-footer">
            <div class="product-price">${fmtCurrency(p.price)}</div>
            ${p.stock > 0
              ? `<button class="btn btn-accent btn-sm" onclick="addToCart(${p.id}, this)">+ Pedir</button>`
              : `<span class="tag" style="color:var(--error)">Agotado</span>`
            }
          </div>
          <div style="margin-top:5px;font-size:.75rem;color:var(--muted)">Disponibles: ${p.stock}</div>
        </div>
      </div>
    `).join('');
  }

  async function addToCart(productId, btn) {
    if (!auth.isLoggedIn()) { window.location.href = '/auth/'; return; }
    btn.disabled = true;
    try {
      await api.post('/cart/add', { product_id: productId, quantity: 1 });
      toast('Agregado a tu pedido', 'success');
      await loadCart();
    } catch (e) { toast(e.message, 'error'); }
    btn.disabled = false;
  }

  async function loadCart() {
    if (!auth.isLoggedIn()) {
      document.getElementById('cart-content').innerHTML = `
        <div class="empty"><div class="empty-icon">🔐</div><h3>Inicia sesión</h3>
        <p>Para hacer pedidos debes iniciar sesión</p>
        <a href="/auth/" class="btn btn-accent mt-2">Ingresar</a></div>`;
      return;
    }
    try {
      cartData = await api.get('/cart');
      renderCart();
      const count = cartData.reduce((s,i) => s + parseInt(i.quantity), 0);
      document.getElementById('tab-cart-count').textContent = count > 0 ? `(${count})` : '';
      document.querySelectorAll('.cart-badge').forEach(el => {
        el.textContent = count;
        el.style.display = count > 0 ? 'flex' : 'none';
      });
    } catch (e) { toast('Error al cargar pedido', 'error'); }
  }

  function renderCart() {
    const container = document.getElementById('cart-content');
    if (!cartData.length) {
      container.innerHTML = `
        <div class="empty"><div class="empty-icon">🛒</div><h3>Tu pedido está vacío</h3>
        <p>Agrega alimentos desde la carta</p>
        <button class="btn btn-accent mt-2" onclick="switchTab('products')">Ver carta</button></div>`;
      return;
    }
    const total = cartData.reduce((s,i) => s + parseFloat(i.subtotal), 0);
    container.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start">
        <div style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <h3 style="font-size:1.1rem">${cartData.length} ítem(s)</h3>
            <button class="btn btn-ghost btn-sm" onclick="clearCart()">🗑 Vaciar</button>
          </div>
          ${cartData.map(item => `
            <div class="cart-item">
              <div class="cart-item-img">
                ${item.image ? `<img src="${item.image}" onerror="this.parentElement.innerHTML='${getCatIcon(item.category)}'">` : getCatIcon(item.category)}
              </div>
              <div style="flex:1">
                <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem">${item.name}</div>
                <div style="color:var(--muted);font-size:.8rem">${fmtCurrency(item.price)} c/u</div>
              </div>
              <div class="qty-ctrl">
                <button class="qty-btn" onclick="changeQty(${item.product_id}, ${item.quantity - 1})">−</button>
                <span class="qty-num">${item.quantity}</span>
                <button class="qty-btn" onclick="changeQty(${item.product_id}, ${item.quantity + 1})">+</button>
              </div>
              <div style="font-family:'Syne',sans-serif;font-weight:800;color:var(--accent);min-width:80px;text-align:right">${fmtCurrency(item.subtotal)}</div>
              <button class="btn-icon btn btn-ghost btn-sm" onclick="removeItem(${item.product_id})" title="Eliminar">✕</button>
            </div>
          `).join('')}
        </div>

        <div class="cart-summary">
          <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;margin-bottom:16px;color:var(--paper)">🧾 Resumen del pedido</div>
          ${cartData.map(i => `
            <div class="summary-row"><span>${i.name} ×${i.quantity}</span><span>${fmtCurrency(i.subtotal)}</span></div>
          `).join('')}
          <div class="summary-total"><span>Total</span><span style="color:var(--accent-light)">${fmtCurrency(total)}</span></div>
          <button class="btn btn-accent btn-full mt-3" style="font-size:1rem;padding:14px" onclick="checkout()">Confirmar pedido → QR</button>
          <p style="color:rgba(247,243,236,.35);font-size:.75rem;text-align:center;margin-top:10px">Pago en efectivo en la cafetería</p>
        </div>
      </div>
    `;
  }

  async function changeQty(productId, newQty) {
    try {
      await api.put('/cart/update', { product_id: productId, quantity: newQty });
      await loadCart();
    } catch (e) { toast(e.message, 'error'); }
  }

  async function removeItem(productId) {
    try {
      await api.del('/cart/' + productId);
      await loadCart();
      toast('Ítem eliminado', 'info');
    } catch (e) { toast(e.message, 'error'); }
  }

  async function clearCart() {
    confirm('¿Vaciar todo el pedido?', async () => {
      await api.del('/cart/clear');
      await loadCart();
      toast('Pedido vaciado', 'info');
    });
  }

  async function checkout() {
    const btn = document.querySelector('#tab-cart button[onclick="checkout()"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Generando QR...'; }
    try {
      const order = await api.post('/orders/checkout', {});
      toast('¡Pedido confirmado! Muestra el QR en la cafetería 🎉', 'success');
      await loadCart();
      showOrderQR(order);
      await loadOrders();
    } catch (e) {
      toast(e.message, 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Confirmar pedido → QR'; }
    }
  }

  function showOrderQR(order) {
    const qrId = 'qr-' + order.id;
    const m = modal(`
      <div style="text-align:center">
        <div style="font-size:2.5rem;margin-bottom:12px">🎉</div>
        <h4 style="margin-bottom:4px">¡Pedido confirmado!</h4>
        <p class="text-muted text-sm mb-2">Pedido #${order.id} — Total: <strong>${fmtCurrency(order.total)}</strong></p>
        <div class="qr-area mt-2">
          <p class="text-sm text-muted mb-2">Muestra este QR en la cafetería para pagar</p>
          <div id="${qrId}" style="display:inline-block;background:white;padding:12px;border-radius:8px"></div>
          <p class="text-xs text-muted mt-2">Token: ${order.qr_token}</p>
        </div>
        <p class="text-muted text-sm mt-2" style="line-height:1.7">📸 Guarda una captura de pantalla.<br/>El encargado escaneará este QR y confirmará tu pago.</p>
        <button class="btn btn-accent btn-full mt-3" onclick="this.closest('.modal-overlay').remove()">Entendido ✓</button>
      </div>
    `, { title: 'Tu QR de pedido' });

    setTimeout(() => {
      new QRCode(document.getElementById(qrId), {
        text: JSON.stringify({ token: order.qr_token, orderId: order.id }),
        width: 200, height: 200, correctLevel: QRCode.CorrectLevel.H
      });
    }, 100);
  }

  async function loadOrders() {
    if (!auth.isLoggedIn()) return;
    try {
      const orders = await api.get('/orders/my');
      renderOrders(orders);
    } catch (e) {}
  }

  function renderOrders(orders) {
    const container = document.getElementById('orders-content');
    if (!orders.length) {
      container.innerHTML = `
        <div class="empty"><div class="empty-icon">📋</div><h3>Sin pedidos</h3>
        <p>Aquí verás tu historial de pedidos una vez que hagas tu primera compra</p>
        <button class="btn btn-accent mt-2" onclick="switchTab('products')">Hacer mi primer pedido</button></div>`;
      return;
    }
    container.innerHTML = '<div style="display:flex;flex-direction:column;gap:16px">' + orders.map(o => `
      <div class="order-card">
        <div class="order-header">
          <div>
            <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:1rem">Pedido #${o.id}</div>
            <div class="text-muted text-sm">${fmtDate(o.created_at)}</div>
          </div>
          <div style="text-align:right">
            ${statusBadge(o.status)}
            <div class="price" style="font-size:1.1rem;margin-top:4px">${fmtCurrency(o.total)}</div>
          </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
          ${o.items.map(i => `<span class="tag">${i.product_name} ×${i.quantity}</span>`).join('')}
        </div>
        <button class="btn btn-ghost btn-sm" onclick="showQR(${o.id}, '${o.qr_token}', ${o.total})">📱 Ver QR</button>
      </div>
    `).join('') + '</div>';
  }

  function showQR(orderId, token, total) {
    const qrId = 'qr-order-' + orderId;
    modal(`
      <div style="text-align:center">
        <h4 style="margin-bottom:4px">QR — Pedido #${orderId}</h4>
        <p class="text-muted text-sm mb-2">Total: <strong>${fmtCurrency(total)}</strong></p>
        <div class="qr-area">
          <div id="${qrId}" style="display:inline-block;background:white;padding:12px;border-radius:8px"></div>
          <p class="text-xs text-muted mt-2">Token: ${token}</p>
        </div>
        <p class="text-muted text-sm mt-2">Presenta este QR al encargado de la cafetería para pagar.</p>
      </div>
    `, { title: 'Tu código QR' });

    setTimeout(() => {
      new QRCode(document.getElementById(qrId), {
        text: JSON.stringify({ token, orderId }),
        width: 200, height: 200, correctLevel: QRCode.CorrectLevel.H
      });
    }, 100);
  }

  function filterCat(btn, cat) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = cat;
    renderProducts(allProducts);
    switchTab('products');
  }

  function searchProducts(q) {
    const base = currentCat ? allProducts.filter(p => p.category === currentCat) : allProducts;
    const filtered = q
      ? base.filter(p => p.name.toLowerCase().includes(q.toLowerCase()) || (p.description || '').toLowerCase().includes(q.toLowerCase()))
      : base;
    const grid = document.getElementById('products-grid');
    document.getElementById('product-count').textContent = filtered.length + ' artículo(s)';
    if (!filtered.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔍</div><h3>Sin resultados</h3><p>Intenta con otro término</p></div>';
      return;
    }
    grid.innerHTML = filtered.map(p => `
      <div class="product-card">
        <div class="product-img">
          ${p.image ? `<img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='${getCatIcon(p.category)}'">` : getCatIcon(p.category)}
        </div>
        <div class="product-body">
          <div class="tag" style="margin-bottom:6px">${getCatLabel(p.category)}</div>
          <div class="product-name">${p.name}</div>
          <div class="product-desc">${p.description || ''}</div>
          <div class="product-footer">
            <div class="product-price">${fmtCurrency(p.price)}</div>
            ${p.stock > 0
              ? `<button class="btn btn-accent btn-sm" onclick="addToCart(${p.id}, this)">+ Pedir</button>`
              : `<span class="tag" style="color:var(--error)">Agotado</span>`
            }
          </div>
          <div style="margin-top:5px;font-size:.75rem;color:var(--muted)">Disponibles: ${p.stock}</div>
        </div>
      </div>
    `).join('');
  }

  function switchTab(tab) {
    document.querySelectorAll('.main-tab').forEach((t,i) => {
      t.classList.toggle('active', ['products','cart','orders'][i] === tab);
    });
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'orders') loadOrders();
    if (tab === 'cart') loadCart();
  }

  init();
</script>
</body>
</html>
