<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
  <title>Cafetería — Santa Juana</title>
  <link rel="icon" href="/imgs/fav-icon.png" type="image/png"/>
  <link rel="stylesheet" href="/assets/css/main.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --tab-height: 56px;
    }
    
    .store-layout { 
      display: grid; 
      grid-template-columns: 260px 1fr; 
      min-height: calc(100vh - 64px);
      background: #fcfcfc;
    }

    .sidebar { 
      background: var(--surface); 
      border-right: 1px solid var(--border); 
      padding: 32px 20px; 
      position: sticky; 
      top: 64px; 
      height: calc(100vh - 64px); 
    }

    .sidebar-title { 
      font-family: 'Syne', sans-serif; 
      font-size: .7rem; 
      font-weight: 800; 
      letter-spacing: .1em; 
      text-transform: uppercase; 
      color: var(--muted); 
      margin: 20px 0 12px 12px; 
    }

    .cat-btn { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      width: 100%; 
      padding: 12px 16px; 
      border: none; 
      background: transparent; 
      border-radius: 12px; 
      font-size: .95rem; 
      cursor: pointer; 
      transition: all .2s; 
      color: var(--ink);
      font-weight: 500;
    }

    .cat-btn:hover { background: var(--cream); color: var(--accent); }
    .cat-btn.active { background: var(--ink); color: var(--paper); box-shadow: var(--shadow-sm); }

    .main-tabs { 
      display: flex; 
      justify-content: center;
      background: var(--surface); 
      position: sticky; 
      top: 64px; 
      z-index: 100; 
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .main-tab { 
      padding: 18px 24px; 
      font-family: 'Syne', sans-serif; 
      font-weight: 700; 
      font-size: .9rem; 
      background: none; 
      border: none; 
      color: var(--muted); 
      cursor: pointer; 
      position: relative;
      transition: all .3s;
    }

    .main-tab.active { color: var(--accent); }
    .main-tab.active::after {
      content: ''; position: absolute; bottom: 0; left: 20%; right: 20%; height: 3px; background: var(--accent); border-radius: 10px 10px 0 0;
    }

    .tab-content { padding: 32px; max-width: 1200px; margin: 0 auto; width: 100%; }
    .tab-content.active { display: block; animation: slideIn .3s ease-out; }

    .product-card { 
      background: var(--surface); 
      border: 1px solid var(--border); 
      border-radius: 20px; 
      overflow: hidden; 
      transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; 
      flex-direction: column;
      position: relative;
    }

    .product-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); border-color: var(--accent); }

    .product-img { 
      height: 160px; 
      background: var(--cream); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 3.5rem; 
      position: relative;
    }

    .product-body { padding: 18px; flex: 1; display: flex; flex-direction: column; }
    .product-name { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1rem; margin-bottom: 6px; color: var(--ink); }
    .product-price { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; color: var(--accent); }

    .mobile-cat-scroll { 
      display: none; 
      overflow-x: auto; 
      gap: 10px; 
      padding: 12px 16px; 
      background: var(--surface); 
      border-bottom: 1px solid var(--border); 
      position: sticky;
      top: 64px;
      z-index: 99;
      -webkit-overflow-scrolling: touch;
    }

    .mobile-cat-chip { 
      flex-shrink: 0; 
      padding: 8px 18px; 
      border-radius: 100px; 
      background: var(--cream); 
      border: 1px solid transparent;
      font-family: 'Syne', sans-serif; 
      font-weight: 700; 
      font-size: .85rem; 
      color: var(--muted);
    }

    .mobile-cat-chip.active { background: var(--accent); color: white; }

    @media(max-width:900px) {
      .store-layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .mobile-cat-scroll { display: flex; }
      .main-tabs { 
        position: fixed; 
        top: auto; 
        bottom: 0; 
        width: 100%; 
        border-top: 1px solid var(--border);
        border-bottom: none;
        padding-bottom: env(safe-area-inset-bottom);
        box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
      }
      .tab-content { padding: 20px 16px 100px; }
      .grid-auto { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .product-img { height: 130px; }
      .product-name { font-size: .9rem; }
      .search-bar { margin-top: 10px; }
    }

    @media(max-width:480px) {
      .grid-auto { grid-template-columns: 1fr 1fr; gap: 10px; }
      .product-img { height: 110px; font-size: 2.5rem; }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .qty-ctrl {
      background: var(--cream);
      border-radius: 100px;
      padding: 4px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
<nav class="nav" id="main-nav"></nav>

<div class="mobile-cat-scroll" id="mobile-cats">
  <button class="mobile-cat-chip active" onclick="filterCatMobile(this,'')">🍽️ Todo</button>
  <button class="mobile-cat-chip" onclick="filterCatMobile(this,'almuerzos')">🍛 Almuerzos</button>
  <button class="mobile-cat-chip" onclick="filterCatMobile(this,'desayunos')">🍳 Desayunos</button>
  <button class="mobile-cat-chip" onclick="filterCatMobile(this,'rapidos')">🌭 Rápidos</button>
  <button class="mobile-cat-chip" onclick="filterCatMobile(this,'bebidas')">🥤 Bebidas</button>
  <button class="mobile-cat-chip" onclick="filterCatMobile(this,'snacks')">🍿 Snacks</button>
</div>

<div class="store-layout">
  <aside class="sidebar">
    <div class="sidebar-title">Menú Principal</div>
    <button class="cat-btn active" onclick="filterCat(this,'')">🍽️ Toda la carta</button>
    
    <div class="sidebar-title">Categorías</div>
    <button class="cat-btn" onclick="filterCat(this,'almuerzos')">🍛 Almuerzos</button>
    <button class="cat-btn" onclick="filterCat(this,'desayunos')">🍳 Desayunos</button>
    <button class="cat-btn" onclick="filterCat(this,'rapidos')">🌭 Platos Rápidos</button>
    <button class="cat-btn" onclick="filterCat(this,'bebidas')">🥤 Bebidas</button>
    <button class="cat-btn" onclick="filterCat(this,'snacks')">🍿 Snacks</button>
    <button class="cat-btn" onclick="filterCat(this,'postres')">🍮 Postres</button>
  </aside>

  <section class="main-content">
    <div class="main-tabs">
      <button class="main-tab active" onclick="switchTab('products')">🍴 Carta</button>
      <button class="main-tab" onclick="switchTab('cart')" id="tab-cart-btn">🛒 Pedido <span id="tab-cart-count"></span></button>
      <button class="main-tab" onclick="switchTab('orders')">📋 Mis QR</button>
    </div>

    <div class="tab-content active" id="tab-products">
      <div class="search-bar">
        <input class="search-input" id="search" placeholder="¿Qué se te antoja hoy?..." oninput="searchProducts(this.value)"/>
      </div>
      
      <div class="grid-auto" id="products-grid">
        </div>
    </div>

    <div class="tab-content" id="tab-cart">
      <div id="cart-content"></div>
    </div>

    <div class="tab-content" id="tab-orders">
      <div id="orders-content"></div>
    </div>
  </section>
</div>
<script src="/assets/js/app.js"></script>
<script>
  buildNav('store');

  let allProducts = [];
  let currentCat = new URLSearchParams(location.search).get('cat') || '';
  let cartData   = [];

  const activeTab = location.hash === '#cart' ? 'cart' : location.hash === '#orders' ? 'orders' : 'products';

  const catIcons = { almuerzos:'🍛', desayunos:'🍳', rapidos:'🌭', bebidas:'🥤', snacks:'🍿', postres:'🍮', general:'🍽️' };
  const catLabels = { almuerzos:'Almuerzo', desayunos:'Desayuno', rapidos:'Plato Rápido', bebidas:'Bebida', snacks:'Snack', postres:'Postre', general:'General' };

  const getCatIcon  = c => catIcons[c]  || '🍽️';
  const getCatLabel = c => catLabels[c] || c;

  async function init() {
    await loadProducts();
    if (auth.isLoggedIn()) {
      await loadCart();
      if (activeTab !== 'products') switchTab(activeTab);
    }
    if (currentCat) {
      document.querySelectorAll('.cat-btn[data-cat],.mobile-cat-chip[data-cat]').forEach(b => {
        b.classList.toggle('active', b.dataset.cat === currentCat);
      });
      renderProducts(allProducts);
    }
  }

  async function loadProducts() {
    try {
      allProducts = await api.get('/products');
      renderProducts(allProducts);
    } catch(e) { toast('Error al cargar el menú', 'error'); }
  }

  function productCardHTML(p) {
    return `
      <div class="product-card">
        <div class="product-img">
          ${p.image ? `<img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='${getCatIcon(p.category)}'">` : getCatIcon(p.category)}
        </div>
        <div class="product-body">
          <div class="tag" style="margin-bottom:6px">${getCatLabel(p.category)}</div>
          <div class="product-name">${p.name}</div>
          <div class="product-desc">${p.description || ''}</div>
          <div class="product-footer">
            <div class="product-price">${fmtCurrency(p.price)}</div>
            ${p.stock > 0
              ? `<button class="btn btn-accent btn-sm" onclick="addToCart(${p.id}, this)">+ Pedir</button>`
              : `<span class="tag" style="color:var(--error)">Agotado</span>`
            }
          </div>
          <div style="margin-top:4px;font-size:.72rem;color:var(--muted)">Disponibles: ${p.stock}</div>
        </div>
      </div>`;
  }

  function renderProducts(products) {
    const grid = document.getElementById('products-grid');
    const filtered = currentCat ? products.filter(p => p.category === currentCat) : products;
    document.getElementById('product-count').textContent = filtered.length + ' artículo(s)';
    if (!filtered.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🍽️</div><h3>Sin productos</h3><p>No hay artículos en esta categoría por ahora</p></div>';
      return;
    }
    grid.innerHTML = filtered.map(productCardHTML).join('');
  }

  async function addToCart(productId, btn) {
    if (!auth.isLoggedIn()) { window.location.href = '/auth/'; return; }
    btn.disabled = true;
    btn.textContent = '...';
    try {
      await api.post('/cart/add', { product_id: productId, quantity: 1 });
      toast('¡Agregado al pedido!', 'success');
      await loadCart();
    } catch(e) { toast(e.message, 'error'); }
    btn.disabled = false;
    btn.textContent = '+ Pedir';
  }

  async function loadCart() {
    if (!auth.isLoggedIn()) {
      document.getElementById('cart-content').innerHTML = `
        <div class="empty"><div class="empty-icon">🔐</div><h3>Inicia sesión</h3>
        <p>Para hacer pedidos debes iniciar sesión</p>
        <a href="/auth/" class="btn btn-accent mt-2">Ingresar</a></div>`;
      return;
    }
    try {
      cartData = await api.get('/cart');
      renderCart();
      const count = cartData.reduce((s,i) => s + parseInt(i.quantity), 0);
      document.getElementById('tab-cart-count').textContent = count > 0 ? `(${count})` : '';
      document.querySelectorAll('.cart-badge').forEach(el => {
        el.textContent = count;
        el.style.display = count > 0 ? 'flex' : 'none';
      });
    } catch(e) { toast('Error al cargar pedido', 'error'); }
  }

  function renderCart() {
    const container = document.getElementById('cart-content');
    if (!cartData.length) {
      container.innerHTML = `
        <div class="empty"><div class="empty-icon">🛒</div><h3>Tu pedido está vacío</h3>
        <p>Agrega alimentos desde la carta</p>
        <button class="btn btn-accent mt-2" onclick="switchTab('products')">Ver carta</button></div>`;
      return;
    }
    const total = cartData.reduce((s,i) => s + parseFloat(i.subtotal), 0);
    container.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start">
        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <h3 style="font-size:1.05rem">${cartData.length} ítem(s)</h3>
            <button class="btn btn-ghost btn-sm" onclick="clearCart()">🗑 Vaciar</button>
          </div>
          ${cartData.map(item => `
            <div class="cart-item">
              <div class="cart-item-img">
                ${item.image ? `<img src="${item.image}" onerror="this.parentElement.innerHTML='${getCatIcon(item.category)}'">` : getCatIcon(item.category)}
              </div>
              <div style="flex:1;min-width:0">
                <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.name}</div>
                <div style="color:var(--muted);font-size:.78rem">${fmtCurrency(item.price)} c/u</div>
              </div>
              <div class="qty-ctrl">
                <button class="qty-btn" onclick="changeQty(${item.product_id}, ${item.quantity - 1})">−</button>
                <span class="qty-num">${item.quantity}</span>
                <button class="qty-btn" onclick="changeQty(${item.product_id}, ${item.quantity + 1})">+</button>
              </div>
              <div style="font-family:'Syne',sans-serif;font-weight:800;color:var(--accent);min-width:72px;text-align:right;font-size:.9rem">${fmtCurrency(item.subtotal)}</div>
              <button class="btn-icon btn btn-ghost btn-sm" onclick="removeItem(${item.product_id})" title="Eliminar">✕</button>
            </div>
          `).join('')}
        </div>
        <div class="cart-summary">
          <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;margin-bottom:16px;color:var(--paper)">🧾 Resumen</div>
          ${cartData.map(i => `
            <div class="summary-row"><span>${i.name} ×${i.quantity}</span><span>${fmtCurrency(i.subtotal)}</span></div>
          `).join('')}
          <div class="summary-total"><span>Total</span><span style="color:var(--accent-light)">${fmtCurrency(total)}</span></div>
          <button class="btn btn-accent btn-full mt-3" style="font-size:.95rem;padding:13px" onclick="checkout()">Confirmar → Obtener QR</button>
          <p style="color:rgba(247,243,236,.35);font-size:.72rem;text-align:center;margin-top:8px">Pago en efectivo en la cafetería</p>
        </div>
      </div>
    `;
  }

  async function changeQty(productId, newQty) {
    try {
      await api.put('/cart/update', { product_id: productId, quantity: newQty });
      await loadCart();
    } catch(e) { toast(e.message, 'error'); }
  }

  async function removeItem(productId) {
    try {
      await api.del('/cart/' + productId);
      await loadCart();
      toast('Ítem eliminado', 'info');
    } catch(e) { toast(e.message, 'error'); }
  }

  async function clearCart() {
    confirm('¿Vaciar todo el pedido?', async () => {
      await api.del('/cart/clear');
      await loadCart();
      toast('Pedido vaciado', 'info');
    });
  }

  async function checkout() {
    const btn = document.querySelector('#tab-cart button[onclick="checkout()"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Generando QR...'; }
    try {
      const order = await api.post('/orders/checkout', {});
      toast('¡Pedido confirmado! Muestra el QR en la cafetería 🎉', 'success');
      await loadCart();
      showOrderQR(order);
      await loadOrders();
    } catch(e) {
      toast(e.message, 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Confirmar → Obtener QR'; }
    }
  }

  function showOrderQR(order) {
    const qrId = 'qr-' + order.id;
    modal(`
      <div style="text-align:center">
        <div style="font-size:2.5rem;margin-bottom:12px">🎉</div>
        <h4 style="margin-bottom:4px">¡Pedido confirmado!</h4>
        <p class="text-muted text-sm mb-2">Pedido #${order.id} — Total: <strong>${fmtCurrency(order.total)}</strong></p>
        <div class="qr-area mt-2">
          <p class="text-sm text-muted mb-2">Muestra este QR en la cafetería para pagar</p>
          <div id="${qrId}" style="display:inline-block;background:white;padding:12px;border-radius:8px"></div>
          <p class="text-xs text-muted mt-2">Token: ${order.qr_token}</p>
        </div>
        <p class="text-muted text-sm mt-2" style="line-height:1.7">📸 Guarda una captura de pantalla.<br/>El encargado escaneará este QR y confirmará tu pago.</p>
        <button class="btn btn-accent btn-full mt-3" onclick="this.closest('.modal-overlay').remove()">Entendido ✓</button>
      </div>
    `, { title: 'Tu QR de pedido' });
    setTimeout(() => {
      new QRCode(document.getElementById(qrId), {
        text: JSON.stringify({ token: order.qr_token, orderId: order.id }),
        width: 200, height: 200, correctLevel: QRCode.CorrectLevel.H
      });
    }, 100);
  }

  async function loadOrders() {
    if (!auth.isLoggedIn()) return;
    try {
      const orders = await api.get('/orders/my');
      renderOrders(orders);
    } catch(e) {}
  }

  function renderOrders(orders) {
    const container = document.getElementById('orders-content');
    if (!orders.length) {
      container.innerHTML = `
        <div class="empty"><div class="empty-icon">📋</div><h3>Sin pedidos</h3>
        <p>Aquí verás tu historial de pedidos</p>
        <button class="btn btn-accent mt-2" onclick="switchTab('products')">Hacer mi primer pedido</button></div>`;
      return;
    }
    container.innerHTML = '<div style="display:flex;flex-direction:column;gap:14px">' + orders.map(o => `
      <div class="order-card">
        <div class="order-header">
          <div>
            <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:1rem">Pedido #${o.id}</div>
            <div class="text-muted text-sm">${fmtDate(o.created_at)}</div>
          </div>
          <div style="text-align:right">
            ${statusBadge(o.status)}
            <div class="price" style="font-size:1.05rem;margin-top:4px">${fmtCurrency(o.total)}</div>
          </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
          ${o.items.map(i => `<span class="tag">${i.product_name} ×${i.quantity}</span>`).join('')}
        </div>
        <button class="btn btn-ghost btn-sm" onclick="showQR(${o.id}, '${o.qr_token}', ${o.total})">📱 Ver QR</button>
      </div>
    `).join('') + '</div>';
  }

  function showQR(orderId, token, total) {
    const qrId = 'qr-order-' + orderId;
    modal(`
      <div style="text-align:center">
        <h4 style="margin-bottom:4px">QR — Pedido #${orderId}</h4>
        <p class="text-muted text-sm mb-2">Total: <strong>${fmtCurrency(total)}</strong></p>
        <div class="qr-area">
          <div id="${qrId}" style="display:inline-block;background:white;padding:12px;border-radius:8px"></div>
          <p class="text-xs text-muted mt-2">Token: ${token}</p>
        </div>
        <p class="text-muted text-sm mt-2">Presenta este QR al encargado de la cafetería.</p>
      </div>
    `, { title: 'Tu código QR' });
    setTimeout(() => {
      new QRCode(document.getElementById(qrId), {
        text: JSON.stringify({ token, orderId }),
        width: 200, height: 200, correctLevel: QRCode.CorrectLevel.H
      });
    }, 100);
  }

  function filterCat(btn, cat) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.mobile-cat-chip').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
    currentCat = cat;
    renderProducts(allProducts);
    switchTab('products');
  }

  function filterCatMobile(btn, cat) {
    document.querySelectorAll('.mobile-cat-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
    currentCat = cat;
    renderProducts(allProducts);
    switchTab('products');
  }

  function searchProducts(q) {
    const base = currentCat ? allProducts.filter(p => p.category === currentCat) : allProducts;
    const filtered = q
      ? base.filter(p => p.name.toLowerCase().includes(q.toLowerCase()) || (p.description || '').toLowerCase().includes(q.toLowerCase()))
      : base;
    const grid = document.getElementById('products-grid');
    document.getElementById('product-count').textContent = filtered.length + ' artículo(s)';
    if (!filtered.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔍</div><h3>Sin resultados</h3><p>Intenta con otro término</p></div>';
      return;
    }
    grid.innerHTML = filtered.map(productCardHTML).join('');
  }

  function switchTab(tab) {
    document.querySelectorAll('.main-tab').forEach((t,i) => {
      t.classList.toggle('active', ['products','cart','orders'][i] === tab);
    });
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'orders') loadOrders();
    if (tab === 'cart') loadCart();
  }

  init();
</script>
</body>
</html>
