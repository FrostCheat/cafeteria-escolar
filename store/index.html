<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cafetería — Santa Juana</title>
  <link rel="icon" href="/imgs/fav-icon.png" type="image/png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --c1:#0d0d0d;--c2:#141414;--c3:#1a1a1a;
      --accent:#ff3c00;--accent2:#ff6b35;--gold:#ffd166;
      --paper:#faf9f7;--cream:#f2ede4;--surface:#ffffff;
      --muted:#888;--border:rgba(0,0,0,0.08);
      --success:#06d6a0;--warning:#ffd166;--error:#ff3b5c;
      --font-display:'Unbounded',sans-serif;--font-body:'Outfit',sans-serif;
      --radius:18px;--radius-lg:24px;
      --shadow:0 4px 24px rgba(0,0,0,0.08);--shadow-lg:0 12px 48px rgba(0,0,0,0.12);
      --spring:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
    body{font-family:var(--font-body);background:var(--paper);color:var(--c1);overflow-x:hidden}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes tabIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes slideDown{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:translateY(0)}}
    @keyframes turnPop{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}

    .store-shell{display:grid;grid-template-columns:260px 1fr;min-height:calc(100dvh - 64px)}
    .sidebar{background:var(--c1);position:sticky;top:64px;height:calc(100dvh - 64px);overflow-y:auto;padding:28px 0;display:flex;flex-direction:column}
    .sidebar::-webkit-scrollbar{width:0}
    .sidebar-heading{font-family:var(--font-display);font-size:0.55rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.25);padding:0 20px;margin-bottom:10px}
    .cat-item{display:flex;align-items:center;gap:12px;padding:12px 20px;border:none;background:transparent;color:rgba(255,255,255,0.5);font-family:var(--font-body);font-size:0.9rem;font-weight:500;cursor:pointer;transition:all 0.2s ease;position:relative;text-align:left;width:100%}
    .cat-item:hover{color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.05)}
    .cat-item.active{color:var(--paper);background:rgba(255,60,0,0.15)}
    .cat-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:24px;background:var(--accent);border-radius:0 3px 3px 0}
    .cat-icon{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0;transition:all 0.2s}
    .cat-item.active .cat-icon{background:rgba(255,60,0,0.25)}
    .cat-divider{height:1px;background:rgba(255,255,255,0.06);margin:10px 20px}

    .main-area{display:flex;flex-direction:column;overflow:hidden}

    .queue-banner{display:none;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 24px;background:var(--c1);border-bottom:2px solid rgba(255,209,102,0.2);position:sticky;top:64px;z-index:25;animation:slideDown 0.4s ease}
    .queue-banner.visible{display:flex}
    .queue-live-dot{width:9px;height:9px;border-radius:50%;background:var(--success);flex-shrink:0;animation:livePulse 1.5s ease-in-out infinite}
    @keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(6,214,160,0.4)}50%{opacity:0.7;box-shadow:0 0 0 6px rgba(6,214,160,0)}}
    .queue-info{display:flex;flex-direction:column;gap:1px}
    .queue-info-label{font-family:var(--font-display);font-size:0.55rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.3)}
    .queue-info-num{font-family:var(--font-display);font-size:1.5rem;font-weight:900;color:var(--gold);letter-spacing:-0.04em;line-height:1}
    .queue-sep{width:1px;height:36px;background:rgba(255,255,255,0.08);flex-shrink:0}
    .queue-my-alert{display:none;align-items:center;gap:10px;padding:8px 16px;background:rgba(255,209,102,0.15);border:1px solid rgba(255,209,102,0.4);border-radius:12px;animation:turnPop 0.5s cubic-bezier(0.34,1.56,0.64,1)}
    .queue-my-alert.visible{display:flex}
    .queue-my-alert-text{font-family:var(--font-display);font-size:0.65rem;font-weight:700;color:var(--gold);letter-spacing:0.04em}
    .queue-my-num{background:var(--gold);color:var(--c1);border-radius:8px;font-family:var(--font-display);font-size:0.72rem;font-weight:900;padding:3px 9px}

    .tab-nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:64px;z-index:20;padding:0 28px}
    .tab-nav-btn{display:flex;align-items:center;gap:8px;padding:18px 14px;border:none;background:transparent;font-family:var(--font-display);font-size:0.72rem;font-weight:700;letter-spacing:0.03em;color:var(--muted);cursor:pointer;position:relative;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color 0.2s;white-space:nowrap}
    .tab-nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
    .tab-count{background:var(--accent);color:#fff;border-radius:100px;padding:1px 7px;font-size:0.65rem;font-weight:700;display:none}
    .tab-count.show{display:inline}
    .tab-content{display:none;padding:28px;animation:tabIn 0.3s ease}
    .tab-content.active{display:block}

    .search-row{display:flex;align-items:center;gap:12px;margin-bottom:24px}
    .search-box{flex:1;position:relative;min-width:0}
    .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:0.9rem;pointer-events:none;z-index:1}
    .search-input{width:100%;padding:13px 16px 13px 44px;border:2px solid var(--border);border-radius:var(--radius);font-family:var(--font-body);font-size:0.9rem;background:var(--surface);color:var(--c1);outline:none;transition:all 0.2s ease;display:block}
    .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,60,0,0.08)}
    .results-count{font-size:0.8rem;color:var(--muted);white-space:nowrap;flex-shrink:0}

    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
    .product-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;transition:var(--spring);cursor:default;position:relative}
    .product-card:hover{transform:translateY(-6px) scale(1.01);box-shadow:var(--shadow-lg);border-color:rgba(255,60,0,0.2)}
    .product-img{height:150px;background:linear-gradient(135deg,var(--cream) 0%,#e8e0d5 100%);display:flex;align-items:center;justify-content:center;font-size:3.5rem;position:relative;overflow:hidden;flex-shrink:0}
    .product-img img{width:100%;height:100%;object-fit:cover;transition:transform 0.4s ease}
    .product-card:hover .product-img img{transform:scale(1.06)}
    .cat-tag{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:100px;background:rgba(0,0,0,0.45);backdrop-filter:blur(8px);font-family:var(--font-display);font-size:0.58rem;font-weight:700;letter-spacing:0.06em;color:rgba(255,255,255,0.9);text-transform:uppercase}
    .stock-badge{position:absolute;top:10px;right:10px;padding:4px 10px;border-radius:100px;background:rgba(255,255,255,0.9);backdrop-filter:blur(8px);font-size:0.7rem;font-weight:700;color:var(--c1)}
    .product-body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}
    .product-name{font-family:var(--font-display);font-size:0.82rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:5px;line-height:1.3}
    .product-desc{font-size:0.78rem;color:var(--muted);line-height:1.5;flex:1;margin-bottom:12px}
    .product-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .product-price{font-family:var(--font-display);font-size:1.05rem;font-weight:900;color:var(--accent);letter-spacing:-0.03em}
    .add-btn{width:36px;height:36px;border-radius:12px;border:none;background:var(--c1);color:var(--paper);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--spring);flex-shrink:0}
    .add-btn:hover{background:var(--accent);transform:scale(1.1)}
    .add-btn:active{transform:scale(0.95)}
    .add-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
    .sold-out-tag{padding:6px 12px;border-radius:10px;background:rgba(255,59,92,0.1);color:var(--error);font-family:var(--font-display);font-size:0.65rem;font-weight:700;letter-spacing:0.05em}

    .cart-layout{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
    .cart-items-wrap{display:flex;flex-direction:column;gap:10px}
    .cart-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:all 0.2s ease;animation:slideIn 0.3s ease}
    .cart-item:hover{box-shadow:var(--shadow);border-color:rgba(255,60,0,0.15)}
    .cart-item-thumb{width:52px;height:52px;border-radius:12px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex-shrink:0;overflow:hidden}
    .cart-item-thumb img{width:100%;height:100%;object-fit:cover}
    .cart-item-info{flex:1;min-width:0}
    .cart-item-name{font-family:var(--font-display);font-size:0.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
    .cart-item-unit{font-size:0.75rem;color:var(--muted)}
    .qty-ctrl{display:flex;align-items:center;gap:4px;background:var(--cream);border-radius:12px;padding:4px}
    .qty-btn{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--c1);font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s ease}
    .qty-btn:hover{background:var(--accent);color:#fff}
    .qty-num{font-family:var(--font-display);font-weight:700;font-size:0.85rem;min-width:24px;text-align:center}
    .cart-item-price{font-family:var(--font-display);font-weight:900;font-size:0.9rem;color:var(--accent);min-width:70px;text-align:right}
    .remove-btn{width:28px;height:28px;border-radius:8px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.9rem;transition:all 0.15s;flex-shrink:0}
    .remove-btn:hover{background:rgba(255,59,92,0.1);color:var(--error)}

    .cart-summary-card{background:var(--c1);border-radius:var(--radius-lg);padding:24px;position:sticky;top:120px;color:var(--paper)}
    .summary-title{font-family:var(--font-display);font-size:0.75rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:18px}
    .summary-line{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:0.85rem;color:rgba(255,255,255,0.55)}
    .summary-line span:last-child{color:rgba(255,255,255,0.8)}
    .summary-total-row{display:flex;justify-content:space-between;align-items:center;padding-top:16px;margin-top:8px;border-top:1px solid rgba(255,255,255,0.1)}
    .summary-total-label{font-family:var(--font-display);font-size:0.75rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:rgba(255,255,255,0.4)}
    .summary-total-val{font-family:var(--font-display);font-size:1.4rem;font-weight:900;color:var(--accent);letter-spacing:-0.03em}
    .checkout-btn{width:100%;padding:16px;margin-top:20px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;font-family:var(--font-display);font-size:0.82rem;font-weight:700;letter-spacing:0.04em;cursor:pointer;transition:var(--spring);position:relative;overflow:hidden}
    .checkout-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 0%,rgba(255,255,255,0.1) 100%)}
    .checkout-btn:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(255,60,0,0.5)}
    .checkout-btn:active{transform:scale(0.98)}
    .checkout-btn:disabled{opacity:0.5;transform:none;cursor:not-allowed}
    .checkout-note{text-align:center;font-size:0.72rem;color:rgba(255,255,255,0.25);margin-top:10px;line-height:1.6}

    .order-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 22px;transition:all 0.2s ease;animation:tabIn 0.3s ease}
    .order-card:hover{box-shadow:var(--shadow)}
    .order-card+.order-card{margin-top:12px}
    .order-card.is-my-turn{border-color:rgba(255,209,102,0.6);box-shadow:0 0 0 3px rgba(255,209,102,0.15)}
    .order-header-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
    .order-id{font-family:var(--font-display);font-size:0.9rem;font-weight:900;letter-spacing:-0.02em}
    .order-date{font-size:0.78rem;color:var(--muted);margin-top:2px}
    .order-right{text-align:right}
    .order-total{font-family:var(--font-display);font-size:1rem;font-weight:900;color:var(--accent);margin-top:4px}
    .order-items-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
    .item-tag{padding:4px 10px;border-radius:100px;background:var(--cream);font-size:0.72rem;font-weight:600;color:var(--c1)}
    .order-footer-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

    .status-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:100px;font-family:var(--font-display);font-size:0.65rem;font-weight:700;letter-spacing:0.05em}
    .status-paid{background:rgba(6,214,160,0.12);color:#04a87d}
    .status-pending{background:rgba(255,209,102,0.15);color:#c59900}
    .status-cancelled{background:rgba(255,59,92,0.12);color:var(--error)}

    .turn-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:100px;background:rgba(255,209,102,0.15);font-family:var(--font-display);font-size:0.65rem;font-weight:700;color:#c59900;letter-spacing:0.05em}
    .turn-pill.active-turn{background:rgba(255,209,102,0.3);color:#8a5a00;animation:turnPop 0.4s ease}

    .qr-show-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:12px;border:1.5px solid var(--border);background:transparent;font-family:var(--font-display);font-size:0.7rem;font-weight:700;color:var(--c1);cursor:pointer;transition:all 0.2s ease}
    .qr-show-btn:hover{background:var(--c1);color:var(--paper);border-color:var(--c1)}

    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 24px}
    .empty-emoji{font-size:4rem;margin-bottom:16px;animation:float 3s ease-in-out infinite}
    .empty-title{font-family:var(--font-display);font-size:1.1rem;font-weight:900;margin-bottom:8px;letter-spacing:-0.02em}
    .empty-sub{font-size:0.875rem;color:var(--muted);margin-bottom:24px}
    .primary-btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;font-family:var(--font-display);font-size:0.78rem;font-weight:700;cursor:pointer;transition:var(--spring)}
    .primary-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(255,60,0,0.4)}

    .mobile-cats{display:none;overflow-x:auto;gap:8px;padding:14px 16px;background:var(--c1);border-bottom:1px solid rgba(255,255,255,0.05);scrollbar-width:none;position:sticky;top:64px;z-index:19}
    .mobile-cats::-webkit-scrollbar{display:none}
    .mobile-cat-pill{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:100px;border:1.5px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.5);font-family:var(--font-display);font-size:0.65rem;font-weight:700;letter-spacing:0.04em;cursor:pointer;transition:all 0.2s ease;white-space:nowrap}
    .mobile-cat-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}

    @media(max-width:1000px){.cart-layout{grid-template-columns:1fr}.cart-summary-card{position:static}}
    @media(max-width:900px){
      .store-shell{grid-template-columns:1fr}.sidebar{display:none}.mobile-cats{display:flex}
      .queue-banner{top:64px}.tab-nav{top:64px;padding:0 16px}
      .tab-content{padding:16px}
      .product-grid{grid-template-columns:repeat(2,1fr);gap:10px}
      .product-img{height:120px;font-size:2.8rem}
      .product-body{padding:10px 12px 12px}
      .product-name{font-size:0.75rem}.product-price{font-size:0.95rem}
      .cart-item{flex-wrap:wrap}.cart-item-price{min-width:auto}
      .queue-info-num{font-size:1.1rem}
    }
    @media(max-width:480px){
      .product-grid{grid-template-columns:repeat(2,1fr);gap:8px}
      .product-img{height:100px;font-size:2.2rem}
      .add-btn{width:32px;height:32px;border-radius:10px}
      .search-row{flex-wrap:wrap}
    }
  </style>
</head>
<body>
<nav class="nav" id="main-nav"></nav>

<div class="queue-banner" id="queue-banner">
  <div class="queue-live-dot"></div>
  <div class="queue-info">
    <div class="queue-info-label">Turno actual</div>
    <div class="queue-info-num" id="queue-current-num">—</div>
  </div>
  <div class="queue-sep"></div>
  <div class="queue-my-alert" id="queue-my-alert">
    <span class="queue-my-alert-text">🎉 ¡Es tu turno!</span>
    <span class="queue-my-num" id="queue-my-num-label"></span>
  </div>
</div>

<div class="mobile-cats" id="mobile-cats">
  <button class="mobile-cat-pill active" data-cat="" onclick="filterCatMobile(this,'')">🍽️ Todo</button>
  <button class="mobile-cat-pill" data-cat="almuerzos" onclick="filterCatMobile(this,'almuerzos')">🍛 Almuerzos</button>
  <button class="mobile-cat-pill" data-cat="desayunos" onclick="filterCatMobile(this,'desayunos')">🍳 Desayunos</button>
  <button class="mobile-cat-pill" data-cat="rapidos" onclick="filterCatMobile(this,'rapidos')">🌭 Rápidos</button>
  <button class="mobile-cat-pill" data-cat="bebidas" onclick="filterCatMobile(this,'bebidas')">🥤 Bebidas</button>
  <button class="mobile-cat-pill" data-cat="snacks" onclick="filterCatMobile(this,'snacks')">🍿 Snacks</button>
  <button class="mobile-cat-pill" data-cat="postres" onclick="filterCatMobile(this,'postres')">🍮 Postres</button>
</div>

<div class="store-shell">
  <aside class="sidebar">
    <div class="sidebar-heading" style="margin-top:4px">Menú</div>
    <button class="cat-item active" data-cat="" onclick="filterCat(this,'')"><div class="cat-icon">🍽️</div> Todo</button>
    <div class="cat-divider"></div>
    <div class="sidebar-heading">Comidas</div>
    <button class="cat-item" data-cat="almuerzos" onclick="filterCat(this,'almuerzos')"><div class="cat-icon">🍛</div> Almuerzos</button>
    <button class="cat-item" data-cat="desayunos" onclick="filterCat(this,'desayunos')"><div class="cat-icon">🍳</div> Desayunos</button>
    <button class="cat-item" data-cat="rapidos" onclick="filterCat(this,'rapidos')"><div class="cat-icon">🌭</div> Platos Rápidos</button>
    <div class="cat-divider"></div>
    <div class="sidebar-heading">Extras</div>
    <button class="cat-item" data-cat="bebidas" onclick="filterCat(this,'bebidas')"><div class="cat-icon">🥤</div> Bebidas</button>
    <button class="cat-item" data-cat="snacks" onclick="filterCat(this,'snacks')"><div class="cat-icon">🍿</div> Snacks</button>
    <button class="cat-item" data-cat="postres" onclick="filterCat(this,'postres')"><div class="cat-icon">🍮</div> Postres</button>
    <button class="cat-item" data-cat="general" onclick="filterCat(this,'general')"><div class="cat-icon">📦</div> General</button>
  </aside>

  <div class="main-area">
    <div class="tab-nav">
      <button class="tab-nav-btn active" onclick="switchTab('products')">🍽️ Carta</button>
      <button class="tab-nav-btn" onclick="switchTab('cart')" id="tab-cart-btn">🛒 Pedido <span class="tab-count" id="tab-cart-count"></span></button>
      <button class="tab-nav-btn" onclick="switchTab('orders')">📋 Mis Pedidos</button>
    </div>

    <div class="tab-content active" id="tab-products">
      <div class="search-row">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input class="search-input" id="search" placeholder="Buscar en el menú..." oninput="searchProducts(this.value)"/>
        </div>
        <span class="results-count" id="product-count"></span>
      </div>
      <div class="product-grid" id="products-grid">
        <div style="grid-column:1/-1;display:flex;justify-content:center;padding:48px">
          <div style="width:36px;height:36px;border:3px solid rgba(0,0,0,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite"></div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-cart">
      <div id="cart-content">
        <div style="display:flex;justify-content:center;padding:48px">
          <div style="width:36px;height:36px;border:3px solid rgba(0,0,0,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite"></div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-orders">
      <div id="orders-content">
        <div style="display:flex;justify-content:center;padding:48px">
          <div style="width:36px;height:36px;border:3px solid rgba(0,0,0,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/assets/js/app.js"></script>
<script src="/assets/js/sse.js"></script>
<script>
  buildNav('store');

  let allProducts = [], currentCat = new URLSearchParams(location.search).get('cat') || '';
  let cartData = [], myOrders = [], queueEnabled = false, currentTurn = 0, prevMyTurn = false;

  const catIcons  = {almuerzos:'🍛',desayunos:'🍳',rapidos:'🌭',bebidas:'🥤',snacks:'🍿',postres:'🍮',general:'📦'};
  const catLabels = {almuerzos:'Almuerzo',desayunos:'Desayuno',rapidos:'Plato Rápido',bebidas:'Bebida',snacks:'Snack',postres:'Postre',general:'General'};
  const getCatIcon  = c => catIcons[c]  || '🍽️';
  const getCatLabel = c => catLabels[c] || c;

  const statusPill = s => { const m={pending:['status-pending','⏳','Pendiente'],paid:['status-paid','✅','Pagado'],cancelled:['status-cancelled','❌','Cancelado']}; const[cls,ic,l]=m[s]||['','?',s]; return `<span class="status-pill ${cls}">${ic} ${l}</span>`; };
  const myPendingTurns = () => myOrders.filter(o => o.status==='pending' && o.turn_number).map(o => parseInt(o.turn_number));

  function applyQueueState(state) {
    queueEnabled = !!state.enabled;
    currentTurn  = parseInt(state.current_turn) || 0;
    const banner = document.getElementById('queue-banner');
    const numEl  = document.getElementById('queue-current-num');
    const alert  = document.getElementById('queue-my-alert');
    const lbl    = document.getElementById('queue-my-num-label');
    if (!queueEnabled) { banner.classList.remove('visible'); return; }
    banner.classList.add('visible');
    numEl.textContent = currentTurn > 0 ? String(currentTurn).padStart(3,'0') : '—';
    const isMyTurn = myPendingTurns().includes(currentTurn);
    if (isMyTurn) { alert.classList.add('visible'); lbl.textContent = '#' + String(currentTurn).padStart(3,'0'); if (!prevMyTurn) toast('🎉 ¡Es tu turno! Ve a recoger tu pedido.','success'); }
    else { alert.classList.remove('visible'); }
    prevMyTurn = isMyTurn;
    if (document.getElementById('tab-orders').classList.contains('active')) renderOrders(myOrders);
  }

  function applyMyOrders(orders) {
    orders.forEach(u => { const o = myOrders.find(x => x.id===u.id); if (o && o.status!==u.status) { const msgs={paid:'✅ Tu pedido #'+u.id+' fue marcado como pagado.',cancelled:'❌ Tu pedido #'+u.id+' fue cancelado.'}; if (msgs[u.status]) toast(msgs[u.status], u.status==='paid'?'success':'error'); } });
    myOrders = orders;
    if (document.getElementById('tab-orders').classList.contains('active')) renderOrders(myOrders);
    if (!document.getElementById('tab-cart').classList.contains('active')) loadCartBadge();
    applyQueueState({enabled:queueEnabled, current_turn:currentTurn});
  }

  function applyProducts(products) {
    allProducts = products;
    const q = document.getElementById('search')?.value || '';
    q ? searchProducts(q) : renderProducts(allProducts);
  }

  SSE.on('connected',          () => {});
  SSE.on('queue',              state  => applyQueueState(state));
  SSE.on('my_orders_updated',  data   => applyMyOrders(data.orders));
  SSE.on('products_updated',   data   => applyProducts(data.products));
  SSE.on('disconnected',       ()     => {});

  async function init() {
    const activeTab = location.hash==='#cart' ? 'cart' : location.hash==='#orders' ? 'orders' : 'products';
    await loadProducts();
    if (auth.isLoggedIn()) {
      SSE.connect();
      await loadCartFull();
      await loadOrders();
      if (activeTab !== 'products') switchTab(activeTab);
    }
    if (currentCat) { document.querySelectorAll('[data-cat]').forEach(b => b.classList.toggle('active', b.dataset.cat===currentCat)); renderProducts(allProducts); }
    try { const state = await api.get('/queue'); applyQueueState(state); } catch(e) {}
  }

  async function loadProducts() {
    try { allProducts = await api.get('/products'); renderProducts(allProducts); }
    catch(e) { toast('Error al cargar el menú','error'); }
  }

  function productCardHTML(p) {
    const icon = getCatIcon(p.category);
    return `<div class="product-card">
      <div class="product-img">
        ${p.image ? `<img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='${icon}'">` : icon}
        <span class="cat-tag">${getCatLabel(p.category)}</span>
        ${p.stock<=3&&p.stock>0 ? `<span class="stock-badge">⚡ ${p.stock} restantes</span>` : ''}
      </div>
      <div class="product-body">
        <div class="product-name">${p.name}</div>
        <div class="product-desc">${p.description||''}</div>
        <div class="product-footer">
          <div class="product-price">${fmtCurrency(p.price)}</div>
          ${p.stock>0 ? `<button class="add-btn" onclick="addToCart(${p.id},this)" title="Agregar">+</button>` : `<span class="sold-out-tag">Agotado</span>`}
        </div>
      </div>
    </div>`;
  }

  function renderProducts(products) {
    const grid = document.getElementById('products-grid');
    const filtered = currentCat ? products.filter(p => p.category===currentCat) : products;
    document.getElementById('product-count').textContent = filtered.length + ' artículos';
    grid.innerHTML = filtered.length
      ? filtered.map(productCardHTML).join('')
      : `<div class="empty-state" style="grid-column:1/-1"><div class="empty-emoji">🍽️</div><div class="empty-title">Sin productos aquí</div><p class="empty-sub">No hay artículos en esta categoría</p></div>`;
  }

  async function addToCart(productId, btn) {
    if (!auth.isLoggedIn()) { window.location.href = '/auth/'; return; }
    btn.disabled = true; btn.innerHTML = '✓';
    try {
      await api.post('/cart/add', {product_id: productId, quantity: 1});
      toast('¡Agregado al pedido!','success');
      await loadCartFull();
    } catch(e) { toast(e.message,'error'); }
    setTimeout(() => { if(btn){btn.disabled=false;btn.innerHTML='+';} }, 800);
  }

  async function loadCartBadge() {
    if (!auth.isLoggedIn()) return [];
    try {
      const items = await api.get('/cart');
      const count = items.reduce((s,i) => s+parseInt(i.quantity), 0);
      const el = document.getElementById('tab-cart-count');
      if (el) { el.textContent=count; el.classList.toggle('show', count>0); }
      document.querySelectorAll('.cart-badge').forEach(b => { b.textContent=count; b.style.display=count>0?'flex':'none'; });
      return items;
    } catch(e) { return []; }
  }

  async function loadCartFull() {
    if (!auth.isLoggedIn()) {
      document.getElementById('cart-content').innerHTML = `<div class="empty-state"><div class="empty-emoji">🔐</div><div class="empty-title">Inicia sesión</div><p class="empty-sub">Para hacer pedidos debes iniciar sesión</p><a href="/auth/" class="primary-btn">Ingresar</a></div>`;
      return;
    }
    try {
      cartData = await api.get('/cart');
      renderCart();
      const count = cartData.reduce((s,i) => s+parseInt(i.quantity), 0);
      const el = document.getElementById('tab-cart-count');
      if (el) { el.textContent=count; el.classList.toggle('show', count>0); }
      document.querySelectorAll('.cart-badge').forEach(b => { b.textContent=count; b.style.display=count>0?'flex':'none'; });
    } catch(e) { toast('Error al cargar pedido','error'); }
  }

  function renderCart() {
    const container = document.getElementById('cart-content');
    if (!cartData.length) {
      container.innerHTML = `<div class="empty-state"><div class="empty-emoji">🛒</div><div class="empty-title">Tu pedido está vacío</div><p class="empty-sub">Agrega alimentos desde la carta</p><button class="primary-btn" onclick="switchTab('products')">Ver carta</button></div>`;
      return;
    }
    const total = cartData.reduce((s,i) => s+parseFloat(i.subtotal), 0);
    container.innerHTML = `<div class="cart-layout">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div style="font-family:var(--font-display);font-size:0.82rem;font-weight:700;color:var(--muted)">${cartData.length} PRODUCTO(S)</div>
          <button onclick="clearCart()" style="background:none;border:none;font-size:0.8rem;color:var(--error);cursor:pointer;font-family:var(--font-display);font-weight:700;">🗑 Vaciar</button>
        </div>
        <div class="cart-items-wrap">
          ${cartData.map(item => `<div class="cart-item">
            <div class="cart-item-thumb">${item.image ? `<img src="${item.image}" onerror="this.parentElement.innerHTML='${getCatIcon(item.category)}'">` : getCatIcon(item.category)}</div>
            <div class="cart-item-info"><div class="cart-item-name">${item.name}</div><div class="cart-item-unit">${fmtCurrency(item.price)} c/u</div></div>
            <div class="qty-ctrl">
              <button class="qty-btn" onclick="changeQty(${item.product_id},${item.quantity-1})">−</button>
              <span class="qty-num">${item.quantity}</span>
              <button class="qty-btn" onclick="changeQty(${item.product_id},${item.quantity+1})">+</button>
            </div>
            <div class="cart-item-price">${fmtCurrency(item.subtotal)}</div>
            <button class="remove-btn" onclick="removeItem(${item.product_id})">✕</button>
          </div>`).join('')}
        </div>
      </div>
      <div class="cart-summary-card">
        <div class="summary-title">🧾 Resumen</div>
        ${cartData.map(i => `<div class="summary-line"><span>${i.name} ×${i.quantity}</span><span>${fmtCurrency(i.subtotal)}</span></div>`).join('')}
        <div class="summary-total-row"><span class="summary-total-label">Total</span><span class="summary-total-val">${fmtCurrency(total)}</span></div>
        <button class="checkout-btn" onclick="checkout()">Confirmar y obtener QR →</button>
        <p class="checkout-note">Pago en efectivo en la cafetería</p>
      </div>
    </div>`;
  }

  async function changeQty(productId, newQty) {
    try { await api.put('/cart/update', {product_id:productId, quantity:newQty}); await loadCartFull(); }
    catch(e) { toast(e.message,'error'); }
  }

  async function removeItem(productId) {
    try { await api.del('/cart/' + productId); await loadCartFull(); }
    catch(e) { toast(e.message,'error'); }
  }

  async function clearCart() {
    confirm('¿Vaciar todo el pedido?', async () => { await api.del('/cart/clear'); await loadCartFull(); });
  }

  async function checkout() {
    const btn = document.querySelector('.checkout-btn');
    if (btn) { btn.disabled=true; btn.textContent='Generando QR...'; }
    try {
      const order = await api.post('/orders/checkout', {});
      toast('¡Pedido confirmado! Muestra el QR en la cafetería 🎉','success');
      await loadCartFull();
      await loadOrders();
      showOrderQR(order);
    } catch(e) {
      toast(e.message,'error');
      if (btn) { btn.disabled=false; btn.textContent='Confirmar y obtener QR →'; }
    }
  }

  function showOrderQR(order) {
    const qrId = 'qr-' + Date.now();
    const turnHTML = order.turn_number ? `<div style="display:inline-flex;align-items:center;gap:12px;background:rgba(255,209,102,0.15);border:1px solid rgba(255,209,102,0.4);border-radius:14px;padding:12px 20px;margin-bottom:16px"><span style="font-size:1.6rem">🎫</span><div style="text-align:left"><div style="font-family:var(--font-display);font-size:0.58rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#b08800;margin-bottom:2px">Tu número de turno</div><div style="font-family:var(--font-display);font-size:2rem;font-weight:900;color:var(--gold);letter-spacing:-0.04em;line-height:1">#${String(order.turn_number).padStart(3,'0')}</div></div></div><br/>` : '';
    modal(`<div style="text-align:center">
      <div style="font-size:2.5rem;margin-bottom:12px">🎉</div>
      <h4 style="font-family:var(--font-display);font-size:1.1rem;margin-bottom:6px">¡Pedido confirmado!</h4>
      <p style="color:var(--muted);font-size:0.875rem;margin-bottom:16px">Pedido #${order.id} — Total: <strong>${fmtCurrency(order.total)}</strong></p>
      ${turnHTML}
      <div style="background:var(--cream);border-radius:20px;padding:24px;display:inline-block;margin-bottom:16px">
        <p style="font-size:0.8rem;color:var(--muted);margin-bottom:14px">Muestra este QR en la cafetería para pagar</p>
        <div id="${qrId}" style="display:inline-block;background:white;padding:12px;border-radius:12px"></div>
        <p style="font-size:0.7rem;color:var(--muted);margin-top:10px">Token: ${order.qr_token}</p>
      </div>
      <p style="font-size:0.8rem;color:var(--muted);margin-bottom:16px;line-height:1.7">📸 Guarda una captura de pantalla.<br/>El encargado escaneará tu QR.</p>
      <button onclick="this.closest('.modal-overlay').remove()" style="width:100%;padding:14px;border:none;border-radius:14px;background:var(--c1);color:#fff;font-family:var(--font-display);font-size:0.8rem;font-weight:700;cursor:pointer;">Entendido ✓</button>
    </div>`, {title:'Tu QR de pedido'});
    setTimeout(() => { const el=document.getElementById(qrId); if(el&&typeof QRCode!=='undefined') new QRCode(el,{text:JSON.stringify({token:order.qr_token,orderId:order.id}),width:200,height:200,correctLevel:QRCode.CorrectLevel.H}); }, 100);
  }

  async function loadOrders() {
    if (!auth.isLoggedIn()) return;
    try { const orders = await api.get('/orders/my'); myOrders=orders; renderOrders(orders); }
    catch(e) {}
  }

  function renderOrders(orders) {
    const container = document.getElementById('orders-content');
    if (!orders.length) {
      container.innerHTML = `<div class="empty-state"><div class="empty-emoji">📋</div><div class="empty-title">Sin pedidos aún</div><p class="empty-sub">Aquí verás tu historial de pedidos</p><button class="primary-btn" onclick="switchTab('products')">Hacer mi primer pedido</button></div>`;
      return;
    }
    container.innerHTML = orders.map(o => {
      const turn = o.turn_number ? parseInt(o.turn_number) : null;
      const isMyTurn = queueEnabled && turn && turn===currentTurn && o.status==='pending';
      const turnPillHTML = turn ? `<span class="turn-pill${isMyTurn?' active-turn':''}">🎫 Turno #${String(turn).padStart(3,'0')}${isMyTurn?' — ¡Ahora!':''}</span>` : '';
      return `<div class="order-card${isMyTurn?' is-my-turn':''}">
        <div class="order-header-row">
          <div><div class="order-id">Pedido #${o.id}</div><div class="order-date">${fmtDate(o.created_at)}</div></div>
          <div class="order-right">${statusPill(o.status)}<div class="order-total">${fmtCurrency(o.total)}</div></div>
        </div>
        <div class="order-items-tags">${(o.items||[]).map(i=>`<span class="item-tag">${i.product_name} ×${i.quantity}</span>`).join('')}</div>
        <div class="order-footer-row">${turnPillHTML}<button class="qr-show-btn" onclick="showQR(${o.id},'${o.qr_token}',${o.total},${turn||'null'})">📱 Ver QR</button></div>
      </div>`;
    }).join('');
  }

  function showQR(orderId, token, total, turnNumber) {
    const qrId = 'qr-order-' + Date.now();
    const turnHTML = turnNumber ? `<div style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,209,102,0.15);border:1px solid rgba(255,209,102,0.3);border-radius:12px;padding:8px 16px;margin-bottom:14px"><span>🎫</span><span style="font-family:var(--font-display);font-size:1rem;font-weight:900;color:var(--gold)">Turno #${String(turnNumber).padStart(3,'0')}</span></div><br/>` : '';
    modal(`<div style="text-align:center">
      <h4 style="font-family:var(--font-display);margin-bottom:6px">QR — Pedido #${orderId}</h4>
      <p style="color:var(--muted);font-size:0.875rem;margin-bottom:14px">Total: <strong>${fmtCurrency(total)}</strong></p>
      ${turnHTML}
      <div style="background:var(--cream);border-radius:20px;padding:24px;display:inline-block">
        <div id="${qrId}" style="display:inline-block;background:white;padding:12px;border-radius:12px"></div>
        <p style="font-size:0.7rem;color:var(--muted);margin-top:10px">Token: ${token}</p>
      </div>
      <p style="font-size:0.8rem;color:var(--muted);margin-top:14px">Presenta este QR al encargado de la cafetería.</p>
    </div>`, {title:'Tu código QR'});
    setTimeout(() => { const el=document.getElementById(qrId); if(el&&typeof QRCode!=='undefined') new QRCode(el,{text:JSON.stringify({token,orderId}),width:200,height:200,correctLevel:QRCode.CorrectLevel.H}); }, 100);
  }

  function filterCat(btn, cat) {
    document.querySelectorAll('.cat-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.mobile-cat-pill').forEach(b => b.classList.toggle('active', b.dataset.cat===cat));
    currentCat = cat; renderProducts(allProducts); switchTab('products');
  }

  function filterCatMobile(btn, cat) {
    document.querySelectorAll('.mobile-cat-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.cat-item').forEach(b => b.classList.toggle('active', b.dataset.cat===cat));
    currentCat = cat; renderProducts(allProducts); switchTab('products');
  }

  function searchProducts(q) {
    const base = currentCat ? allProducts.filter(p => p.category===currentCat) : allProducts;
    const filtered = q ? base.filter(p => p.name.toLowerCase().includes(q.toLowerCase()) || (p.description||'').toLowerCase().includes(q.toLowerCase())) : base;
    document.getElementById('product-count').textContent = filtered.length + ' artículos';
    const grid = document.getElementById('products-grid');
    grid.innerHTML = filtered.length
      ? filtered.map(productCardHTML).join('')
      : `<div class="empty-state" style="grid-column:1/-1"><div class="empty-emoji">🔍</div><div class="empty-title">Sin resultados</div><p class="empty-sub">Intenta con otro término</p></div>`;
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-nav-btn').forEach((t,i) => t.classList.toggle('active', ['products','cart','orders'][i]===tab));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-'+tab).classList.add('active');
    if (tab==='orders') loadOrders();
    if (tab==='cart') loadCartFull();
  }

  init();
</script>
</body>
</html>
